name: Release

# Builds the platform binaries we cannot build on the local Linux/Docker machine and
# publishes them to a GitHub Release. GitHub provides the OS-native runners —
# windows-latest (MSVC) and macos-latest (Xcode) — free for public repos.
#
# Trigger: push a tag like `v0.1.0-beta.1`. The `release` job creates the GitHub
# Release first (curated notes from dev/releases/<tag>.md when that file exists,
# generated notes otherwise; alpha/beta/rc tags are marked pre-release), then each
# platform job uploads its asset to it. Running manually via workflow_dispatch
# builds + uploads artifacts only (no release).
#
# macOS builds are Developer ID signed + notarized (secrets APPLE_*, org-level).
# The signed zip is published BEFORE notarization so an Apple notary outage or
# timeout can never block a release — the stapled zip/DMG then replace/join it.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  # The single pinned rclone version for the whole release: bundled into the
  # Store MSIX (windows job), built into librclone, and built as the Android
  # jniLib (android job). Keep in sync with dev/android/build-rclone.ps1 +
  # dev/desktop/build-librclone.sh — ci.yml greps this line and enforces it.
  # v1.75.0 (2026-07-31). Carries forward the v1.74.4 security patch (CVEs in
  # serve s3 / serve webdav / local-backend symlink escape — all surfaces
  # Airclone ships). No breaking changes in the 1.74 -> 1.75 changelog; the two
  # rc entries that touch our surface ("allow setting rc config and filter
  # options as flat parameters", "serve rc accepts nested as well as flat
  # options") are ADDITIVE. Verified against a real v1.75.0 binary before
  # bumping: `--rc-serve` still answers Range with 206 + Content-Range (the
  # preview/thumbnail path), and `config/create` still requires the
  # `parameters` key on every call including continue steps (the regression
  # that cost a Store certification cycle — see AddRemoteController.answer).
  RCLONE_VERSION: v1.75.0

# ── The Flutter version is PINNED everywhere below. Bump it deliberately. ─────
# `channel: stable` is a moving target. On 2026-08-15 it moved to 3.47.0 in the
# middle of the v0.6.3 release and broke every platform job at once, none of it
# in our code: `pdfrx` 1.3.5 stopped compiling under the newer analyzer, the new
# Flutter Gradle plugin demanded Gradle >= 8.14 (we were on 8.11.1), and `dart
# format` reformatted a test file the release never touched.
#
# The 3.47.0 upgrade was then done as its own change — pdfrx 2.x, Gradle 8.14.3,
# a reformat — and verified across all four platforms before landing. Treat the
# next bump the same way: change this pin on a branch, run this workflow with
# workflow_dispatch (builds artifacts, publishes nothing), and only then merge.
# Keep docker-compose.yml on the same version, or local checks disagree with CI.
defaults:
  run:
    working-directory: app

jobs:
  release:
    # Creates the GitHub Release up front so the platform jobs only ever upload
    # assets — one owner for the notes + prerelease flag instead of four racing
    # publish steps (which used to make release notes whoever-finishes-first).
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Create GitHub Release
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists — leaving it as-is."
            exit 0
          fi
          args=(--repo "$GITHUB_REPOSITORY" --title "Airclone $GITHUB_REF_NAME" --verify-tag)
          case "$GITHUB_REF_NAME" in
            *alpha*|*beta*|*rc*) args+=(--prerelease) ;;
          esac
          notes="dev/releases/$GITHUB_REF_NAME.md"
          if [ -f "$notes" ]; then
            args+=(--notes-file "$notes")
          else
            echo "::warning::No curated notes at $notes — falling back to generated notes."
            args+=(--generate-notes)
          fi
          gh release create "$GITHUB_REF_NAME" "${args[@]}"

  # Build the in-process engine (librclone) ONCE per OS, ISOLATED from the app
  # build, and hand it to the platform jobs as an artifact. Keeping the Go
  # toolchain + heavy cgo build OUT of the flutter-build environment is
  # deliberate: a gcc left on PATH would hijack the Windows MSVC/CMake build, and
  # the rclone build cache is multi-GB. A leg that fails just means that platform
  # ships binary-engine-only (the download below is non-fatal). librclone.yml is
  # the standalone hard gate that also FFI-tests each lib.
  librclone:
    needs: release
    if: ${{ !cancelled() && (needs.release.result == 'success' || github.event_name == 'workflow_dispatch') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, out: app/windows/librclone/librclone.dll, artifact: librclone-windows }
          - { os: macos-latest, out: app/macos/librclone/librclone.dylib, artifact: librclone-macos }
          - { os: ubuntu-latest, out: app/linux/librclone/librclone.so, artifact: librclone-linux }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        # cache:false — no committed go.sum (the build script synthesizes the
        # pinning module in /tmp), so the default cache lookup warns + caches nothing.
        with: { go-version: 'stable', cache: false }
      - name: Set up mingw-w64 (cgo compiler)
        if: runner.os == 'Windows'
        uses: ./.github/actions/ensure-mingw
      - name: Build librclone (Windows)
        if: runner.os == 'Windows'
        working-directory: .
        shell: pwsh
        run: ./dev/desktop/build-librclone.ps1
      - name: Build librclone (macOS/Linux)
        if: runner.os != 'Windows'
        working-directory: .
        run: bash dev/desktop/build-librclone.sh
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.out }}
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    needs: [release, librclone]
    # Tag push: run once the release exists. workflow_dispatch: release job is
    # skipped by design, build artifacts only.
    if: ${{ !cancelled() && (needs.release.result == 'success' || github.event_name == 'workflow_dispatch') }}
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: 3.47.0, cache: true }
      # super_native_extensions (drag-out) builds a Rust crate via cargokit.
      - uses: dtolnay/rust-toolchain@stable
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      # Pull in the prebuilt in-process engine (from the `librclone` job) so the
      # Windows CMake install bundles it next to airclone.exe. Non-fatal: a
      # missing artifact -> binary-engine-only build (CMake EXISTS-guards it). NO
      # Go/mingw in this job, so nothing pollutes the MSVC build.
      - name: Download prebuilt librclone
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: librclone-windows
          path: app/windows/librclone
      - name: Ensure a NuGet package source (local_auth_windows WIL restore)
        shell: pwsh
        run: |
          # local_auth_windows' CMake runs `nuget install
          # Microsoft.Windows.ImplementationLibrary` and FATAL_ERRORs (=> "Unable
          # to generate build files") if no package source is registered. Register
          # nuget.org explicitly (idempotent) — writes the user NuGet config that
          # both a PATH nuget and the plugin's downloaded nuget read.
          $nuget = (Get-Command nuget -ErrorAction SilentlyContinue).Source
          if (-not $nuget) {
            choco install nuget.commandline -y --no-progress | Out-Null
            $nuget = (Get-Command nuget -ErrorAction SilentlyContinue).Source
          }
          if (-not (& $nuget sources list | Select-String -Quiet 'api\.nuget\.org')) {
            & $nuget sources add -Name nuget.org -Source https://api.nuget.org/v3/index.json
          }
          & $nuget sources list
      - run: flutter build windows --release
      # HARD GATE: the build must be self-contained with respect to the MSVC
      # runtime. windows/CMakeLists.txt copies it app-local via
      # InstallRequiredSystemLibraries, but a missing/renamed VS redist directory
      # only makes CMake *warn* — so verify the artifact, never the green check
      # (the rclone-bundling bug hid behind exactly that for v0.5.0-v0.5.2).
      # Microsoft Store certification failed this on 2026-07-29: policy 10.2.4.1
      # (undisclosed dependency on non-integrated software: "VC++"), and on a
      # clean device the app cannot even start without these next to the exe.
      - name: Verify the VC++ runtime is bundled (self-contained build)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $rel = "build/windows/x64/runner/Release"
          foreach ($dll in @('msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll')) {
            if (-not (Test-Path "$rel/$dll")) {
              throw "$dll is not next to airclone.exe in $rel - this build would require the Visual C++ Redistributable (Store policy 10.2.4.1) and would not launch on a clean machine."
            }
          }
          Get-ChildItem $rel -Filter '*140*.dll' | ForEach-Object { Write-Output "bundled MSVC runtime: $($_.Name) ($($_.Length) bytes)" }
      - name: Note whether librclone bundled
        shell: pwsh
        run: |
          if (Test-Path build/windows/x64/runner/Release/librclone.dll) {
            Write-Output "in-process engine bundled OK"
          } else {
            Write-Output "::warning::librclone.dll not bundled - this build ships the binary engine only."
          }
      # Bundle a SHA256-verified rclone.exe into EVERY Windows artifact (portable
      # zip, Inno installer, AND the Store MSIX). Done HERE — before signing and
      # packaging — so (a) the Trusted Signing step below also signs rclone.exe,
      # and (b) all three artifacts are self-contained and never download the
      # engine on first run. The app uses this bundled engine by default;
      # unpackaged builds may still update it in-app, while the MSIX (detected at
      # runtime via GetCurrentPackageFullName) never downloads — Store policy.
      # FATAL (with download retries): a self-contained installer is the whole point
      # now, so a bundling failure must stop the build loudly rather than silently
      # ship an engine-less one. (This was `continue-on-error` and it HID a real bug
      # across many releases — no artifact ever actually bundled rclone.) SHA256SUMS
      # is read from a FILE via Get-Content, NOT `(...).Content -split`: the server's
      # content-type made the in-memory parse yield $null, so nothing was copied.
      - name: Bundle rclone into the Windows build (verified)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = "${env:RCLONE_VERSION}"          # workflow-level pin, e.g. v1.74.4
          $triple = "windows-amd64"
          $zip = "rclone-$ver-$triple.zip"
          $base = "https://downloads.rclone.org/$ver"
          Invoke-WebRequest "$base/$zip" -OutFile $zip -MaximumRetryCount 3 -RetryIntervalSec 5
          Invoke-WebRequest "$base/SHA256SUMS" -OutFile SHA256SUMS.txt -MaximumRetryCount 3 -RetryIntervalSec 5
          $expected = $null
          foreach ($l in (Get-Content SHA256SUMS.txt)) {
            $parts = $l -split '\s+'
            if ($parts.Count -ge 2 -and ($parts[-1].TrimStart('*', '.', '/')) -eq $zip) { $expected = $parts[0].ToUpper(); break }
          }
          if (-not $expected) { throw "no checksum for $zip in SHA256SUMS" }
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToUpper()
          if ($actual -ne $expected) { throw "rclone checksum mismatch (expected $expected, got $actual)" }
          Expand-Archive $zip -DestinationPath rclone-extract -Force
          $rel = "build/windows/x64/runner/Release"
          Copy-Item "rclone-extract/rclone-$ver-$triple/rclone.exe" "$rel/rclone.exe" -Force
          if (-not (Test-Path "$rel/rclone.exe")) { throw "rclone.exe was not copied into $rel" }
          Write-Output "Bundled rclone $ver into $rel ($((Get-Item "$rel/rclone.exe").Length) bytes) for zip + installer + MSIX."
      # Code signing (Azure Trusted Signing) — PRE-WIRED, OFF until you set repo
      # var WINDOWS_SIGNING_ENABLED=true + the AZURE_* secrets/vars (see
      # dev/windows-signing-and-store.md). Signs airclone.exe AND the bundled
      # rclone.exe (both .exe in the Release dir) HERE, before the zip and installer
      # package them, so the installed app is trusted too. `uses:` steps ignore the
      # job's working-directory, so paths are workspace-relative.
      - name: Sign app binary (Azure Trusted Signing)
        if: ${{ vars.WINDOWS_SIGNING_ENABLED == 'true' }}
        uses: azure/trusted-signing-action@v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files-folder: app/build/windows/x64/runner/Release
          files-folder-filter: exe
          files-folder-recurse: false
      - name: Package (portable zip)
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath airclone-windows-x64.zip
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          # Inno Setup ships on the windows-latest image; fall back to choco.
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress | Out-Null
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          $ver = ((Select-String -Path pubspec.yaml -Pattern '^version:' | Select-Object -First 1).Line -split ':')[1].Trim().Split('+')[0]
          Write-Output "Building Airclone installer for $ver with $iscc"
          & $iscc /DAppVersion=$ver windows/installer/airclone.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compile failed ($LASTEXITCODE)" }
      # Sign the installer itself (same Azure Trusted Signing gate as above).
      - name: Sign installer (Azure Trusted Signing)
        if: ${{ vars.WINDOWS_SIGNING_ENABLED == 'true' }}
        uses: azure/trusted-signing-action@v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files-folder: app/windows/installer
          files-folder-filter: exe
          files-folder-recurse: false
      - uses: actions/upload-artifact@v6
        with:
          name: airclone-windows-x64
          path: |
            app/airclone-windows-x64.zip
            app/windows/installer/airclone-setup-x64.exe
      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" airclone-windows-x64.zip --clobber --repo "$GITHUB_REPOSITORY"
          gh release upload "$GITHUB_REF_NAME" windows/installer/airclone-setup-x64.exe --clobber --repo "$GITHUB_REPOSITORY"
      # MSIX for the Microsoft Store. --store => unsigned, Partner-Center-ready
      # (the Store signs it), so no certificate and no interactive prompt.
      #
      # IDENTITY comes from repo variables, NOT pubspec — Package/Identity/Publisher
      # is a Partner-Center-assigned GUID and this repo is public. pubspec keeps
      # inert placeholders so local builds still work; these three override them:
      #   MSIX_IDENTITY_NAME  -> Package/Identity/Name       (reserved package name)
      #   MSIX_PUBLISHER      -> Package/Identity/Publisher  (CN=<GUID>)
      #   MSIX_DISPLAY_NAME   -> Package/Properties/DisplayName (must be a RESERVED
      #                          app name; also becomes the Start-menu tile, since
      #                          msix drives both from one displayName)
      # All must match Partner Center → Product management → Product identity
      # EXACTLY, or the upload is rejected before certification starts.
      # Non-fatal: a Store package is optional and must never break the release.
      - name: Build MSIX (Microsoft Store package)
        continue-on-error: true
        shell: pwsh
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_DISPLAY_NAME: ${{ vars.MSIX_DISPLAY_NAME }}
        run: |
          # Refuse to build an engine-less Store package. The "Bundle rclone" step above
          # is now FATAL (v0.5.3 fix), so rclone.exe is guaranteed present by the time we
          # reach here — this is a belt-and-suspenders guard. If it were ever missing,
          # throw: this step is continue-on-error, so the result is simply NO msix this
          # tag (the Store lane is optional) rather than a silently engine-less one.
          $rel = "build/windows/x64/runner/Release"
          if (-not (Test-Path "$rel/rclone.exe")) {
            throw "rclone.exe was not bundled into $rel (bundle step failed) — refusing to build an engine-less Store MSIX."
          }
          $ver = ((Select-String -Path pubspec.yaml -Pattern '^version:' | Select-Object -First 1).Line -split ':')[1].Trim().Split('+')[0]
          # Override the pubspec placeholders with the real Partner Center identity.
          # A missing variable is loud: the package still builds (useful for testing
          # the payload) but is NOT submittable, and silence here is exactly how the
          # v0.6.0 package shipped with placeholder identity in the first place.
          $identity = @()
          $missing = @()
          foreach ($v in @(
            @{ env = 'MSIX_IDENTITY_NAME'; flag = '--identity-name' },
            @{ env = 'MSIX_PUBLISHER';     flag = '--publisher' },
            @{ env = 'MSIX_DISPLAY_NAME';  flag = '--display-name' })) {
            $val = [Environment]::GetEnvironmentVariable($v.env)
            if ([string]::IsNullOrWhiteSpace($val)) { $missing += $v.env }
            else { $identity += @($v.flag, $val) }
          }
          if ($missing.Count -gt 0) {
            Write-Output "::warning::MSIX identity variable(s) not set: $($missing -join ', '). The package will carry pubspec PLACEHOLDER identity and Partner Center will reject it. Set them under Settings → Secrets and variables → Actions → Variables."
          } else {
            Write-Output "MSIX identity supplied from repo variables (name + publisher + display name)."
          }
          dart run msix:create --store --version "$ver.0" --build-windows false --output-path . --output-name airclone @identity
      # Also publish the MSIX as a run artifact, so a workflow_dispatch run can
      # produce a corrected Store package (e.g. after an identity fix) WITHOUT
      # minting a new tag/release. The release upload below is tag-only.
      - name: Upload MSIX artifact
        if: hashFiles('app/airclone.msix') != ''
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: airclone-msix
          path: app/airclone.msix
      - name: Upload MSIX to release
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f airclone.msix ]; then
            gh release upload "$GITHUB_REF_NAME" airclone.msix --clobber --repo "$GITHUB_REPOSITORY"
          else
            echo "no airclone.msix produced — skipping (non-fatal)"
          fi
      # Microsoft Store submission — PRE-WIRED, OFF until you set repo var
      # STORE_PUBLISH_ENABLED=true + the STORE_* secrets and STORE_APP_ID, AND fill
      # the real Partner Center identity in pubspec's msix_config. Runs only on a
      # tag and is non-fatal. See dev/windows-signing-and-store.md (verify the exact
      # `msstore publish` flags against `msstore --help` at activation time).
      - name: Submit MSIX to Microsoft Store
        if: ${{ vars.STORE_PUBLISH_ENABLED == 'true' && startsWith(github.ref, 'refs/tags/') }}
        continue-on-error: true
        shell: pwsh
        env:
          MSSTORE_TENANT: ${{ secrets.STORE_TENANT_ID }}
          MSSTORE_CLIENT: ${{ secrets.STORE_CLIENT_ID }}
          MSSTORE_SECRET: ${{ secrets.STORE_CLIENT_SECRET }}
          MSSTORE_SELLER: ${{ secrets.STORE_SELLER_ID }}
        run: |
          dotnet tool install --global MSStore.CLI | Out-Null
          msstore reconfigure --tenantId $env:MSSTORE_TENANT --sellerId $env:MSSTORE_SELLER --clientId $env:MSSTORE_CLIENT --clientSecret $env:MSSTORE_SECRET
          msstore publish airclone.msix --appId ${{ vars.STORE_APP_ID }}

  linux:
    runs-on: ubuntu-latest
    needs: [release, librclone]
    if: ${{ !cancelled() && (needs.release.result == 'success' || github.event_name == 'workflow_dispatch') }}
    steps:
      - uses: actions/checkout@v5
      - name: Install build deps
        # libmpv-dev + mpv: media_kit (video/audio preview) — without them
        # `flutter build linux` fails to link (regressed in alpha.6).
        # libsecret-1-dev: flutter_secure_storage_linux (OS credential vault, added
        # for config portability) — its CMake pkg_check_modules(libsecret-1) errors
        # "Unable to generate build files" without it.
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev libmpv-dev mpv libsecret-1-dev
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: 3.47.0, cache: true }
      # super_native_extensions (drag-out) builds a Rust crate via cargokit.
      - uses: dtolnay/rust-toolchain@stable
      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      # Pull in the prebuilt in-process engine (from the `librclone` job) so the
      # Linux CMake install bundles it next to the executable. Non-fatal (see the
      # Windows job). NO Go build here, so the rclone build cache never competes
      # with `flutter build` for the runner's disk.
      - name: Download prebuilt librclone
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: librclone-linux
          path: app/linux/librclone
      - run: flutter build linux --release
      - name: Note whether librclone bundled
        run: |
          if [ -f build/linux/x64/release/bundle/librclone.so ]; then
            echo "in-process engine bundled OK"
          else
            echo "::warning::librclone.so not bundled - this build ships the binary engine only."
          fi
      - name: Package
        run: tar -czf airclone-linux-x64.tar.gz -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v6
        with:
          name: airclone-linux-x64
          path: app/airclone-linux-x64.tar.gz
      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" airclone-linux-x64.tar.gz --clobber --repo "$GITHUB_REPOSITORY"

  macos:
    runs-on: macos-latest
    needs: [release, librclone]
    if: ${{ !cancelled() && (needs.release.result == 'success' || github.event_name == 'workflow_dispatch') }}
    timeout-minutes: 90
    env:
      # Job-level so step `if:`s can test them; empty on forks (which then build
      # ad-hoc-signed artifacts only — the tag guard below keeps releases signed).
      HAS_SIGNING_CERT: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12_BASE64 != '' }}
      HAS_NOTARY_CREDS: ${{ secrets.APPLE_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
    steps:
      - uses: actions/checkout@v5
      # Fail fast on a tagged release if the signing cert is missing — mirrors the
      # Android keystore guard: never publish an unsigned "release" build.
      - name: Require Developer ID signing on tagged builds
        if: startsWith(github.ref, 'refs/tags/') && env.HAS_SIGNING_CERT != 'true'
        run: |
          echo "::error::Tagged release but APPLE_DEVELOPER_ID_APPLICATION_P12_BASE64 is missing — refusing to publish an unsigned macOS build."
          exit 1
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: 3.47.0, cache: true }
      # super_native_extensions (drag-out) builds a Rust crate via cargokit.
      - uses: dtolnay/rust-toolchain@stable
      - run: flutter config --enable-macos-desktop
      - run: flutter pub get
      # Pull in the prebuilt UNIVERSAL librclone.dylib (from the `librclone` job).
      # macOS bundling is a manual copy (Xcode, not CMake): the next step drops it
      # into Contents/Frameworks AFTER the app build but BEFORE codesign, so the
      # inside-out codesign pass (which walks Frameworks) seals it and it passes
      # notarization. Non-fatal (see the Windows job).
      - name: Download prebuilt librclone
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: librclone-macos
          path: app/macos/librclone
      - run: flutter build macos --release
      - name: Bundle librclone into the app (Frameworks)
        # Tolerant of a missing dylib (a failed/ skipped librclone build): the app
        # then ships binary-engine-only rather than failing the release. Runs
        # BEFORE codesign so the inside-out pass seals the dylib (notarization-safe).
        run: |
          set -euo pipefail
          APP="build/macos/Build/Products/Release/Airclone.app"
          if [ -f macos/librclone/librclone.dylib ]; then
            mkdir -p "$APP/Contents/Frameworks"
            cp macos/librclone/librclone.dylib "$APP/Contents/Frameworks/librclone.dylib"
            lipo -info "$APP/Contents/Frameworks/librclone.dylib"  # must be universal
            echo "in-process engine bundled OK"
          else
            echo "::warning::librclone.dylib not built - this build ships the binary engine only."
          fi
      - name: Import Developer ID certificate
        if: env.HAS_SIGNING_CERT == 'true'
        env:
          P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}
        run: |
          set -euo pipefail
          CERT="$RUNNER_TEMP/developer_id_application.p12"
          KEYCHAIN="$RUNNER_TEMP/app-signing.keychain-db"
          echo "$P12_BASE64" | base64 --decode > "$CERT"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed 's/"//g')
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # Discover the identity from the cert itself — no extra secret to configure.
          # Use the SHA-1 hash (column 2), not the display name: hash-signing stays
          # unambiguous if a renewed same-name cert ever coexists in the keychain.
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | awk '/Developer ID Application/ {print $2; exit}')
          if [ -z "$IDENTITY" ]; then
            echo "::error::No 'Developer ID Application' identity found in the imported .p12."
            exit 1
          fi
          echo "CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
      - name: Codesign (Hardened Runtime)
        if: env.HAS_SIGNING_CERT == 'true'
        run: |
          set -euo pipefail
          APP="build/macos/Build/Products/Release/Airclone.app"
          # Inside-out, per Apple's guidance (no --deep): first every Mach-O leaf
          # buried in Frameworks (plugin dylibs, media_kit's libmpv, etc.), then the
          # framework bundles (sealing the fresh leaf signatures), then the app.
          # Every regular file goes through the `file` type check — gating on name
          # or exec-bit would miss an oddly-named nested Mach-O, which notarization
          # then rejects as an unsigned binary.
          while IFS= read -r -d '' f; do
            if file -b "$f" | grep -q 'Mach-O'; then
              codesign --force --timestamp --options runtime --sign "$CODESIGN_IDENTITY" "$f"
            fi
          done < <(find "$APP/Contents/Frameworks" -type f -print0)
          while IFS= read -r -d '' fw; do
            codesign --force --timestamp --options runtime --sign "$CODESIGN_IDENTITY" "$fw"
          done < <(find "$APP/Contents/Frameworks" -mindepth 1 -maxdepth 1 -name '*.framework' -print0)
          codesign --force --timestamp --options runtime \
            --entitlements macos/Runner/Release.entitlements \
            --sign "$CODESIGN_IDENTITY" "$APP"
          codesign --verify --strict --verbose=2 "$APP"
      - name: Package (zip)
        # ditto (not zip) preserves symlinks/metadata the way notarization expects.
        run: ditto -c -k --keepParent build/macos/Build/Products/Release/Airclone.app airclone-macos.zip
      - uses: actions/upload-artifact@v6
        with:
          name: airclone-macos
          path: app/airclone-macos.zip
      # Publish the signed zip BEFORE notarization so an Apple notary outage or
      # timeout can never block the release (abcli hit exactly that); the stapled
      # zip + DMG below replace/join it when notarization succeeds.
      - name: Upload signed zip to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" airclone-macos.zip --clobber --repo "$GITHUB_REPOSITORY"
      - name: Notarize + staple app
        id: notarize
        if: env.HAS_SIGNING_CERT == 'true' && env.HAS_NOTARY_CREDS == 'true'
        # Best-effort: the signed zip is already published; a notary failure or
        # timeout must not fail the release. Later steps key off this outcome.
        # notarize.sh bounds every submit (--timeout, NEVER a naked --wait),
        # captures the submission id, always dumps `notarytool log`, and retries
        # only fast unregistered failures — a timed-out submission keeps
        # processing at Apple, so a later run can still staple it.
        continue-on-error: true
        timeout-minutes: 30 # safety net only — the real guard is NOTARY_TIMEOUT
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_TIMEOUT: 20m
          NOTARY_RETRIES: '2'
        run: |
          set -euo pipefail
          APP="build/macos/Build/Products/Release/Airclone.app"
          bash "$GITHUB_WORKSPACE/.github/scripts/notarize.sh" airclone-macos.zip app
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          # Rebuild the zip so the published asset carries the stapled ticket.
          rm -f airclone-macos.zip
          ditto -c -k --keepParent "$APP" airclone-macos.zip
      - name: Package DMG
        id: dmg
        if: steps.notarize.outcome == 'success'
        # Best-effort like the notarize steps: an hdiutil/timestamp-server hiccup
        # here must not red the job or block re-publishing the stapled zip below.
        continue-on-error: true
        run: |
          set -euo pipefail
          APP="build/macos/Build/Products/Release/Airclone.app"
          STAGING="$RUNNER_TEMP/dmg-staging"
          mkdir -p "$STAGING"
          # ditto (not cp) faithfully preserves the signed bundle + stapled ticket.
          ditto "$APP" "$STAGING/Airclone.app"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create -volname "Airclone" -srcfolder "$STAGING" -ov -format UDZO airclone-macos.dmg
          codesign --force --timestamp --sign "$CODESIGN_IDENTITY" airclone-macos.dmg
      - name: Notarize + staple DMG
        # Also best-effort: the app inside is already stapled, so even an
        # un-notarized DMG container passes Gatekeeper once the app is copied out.
        # (Serial after the app on purpose: building the DMG from the already-
        # stapled app means a fully-offline first launch from the DMG never
        # prompts — worth the second bounded wait.)
        if: steps.dmg.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 30
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_TIMEOUT: 20m
          NOTARY_RETRIES: '2'
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/.github/scripts/notarize.sh" airclone-macos.dmg dmg
          xcrun stapler staple airclone-macos.dmg
          xcrun stapler validate airclone-macos.dmg
      # Two separate uploads so a DMG-only failure can never block re-publishing
      # the stapled zip (which replaces the pre-notarization signed zip).
      - name: Upload stapled zip to release
        if: startsWith(github.ref, 'refs/tags/') && steps.notarize.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" airclone-macos.zip --clobber --repo "$GITHUB_REPOSITORY"
      - name: Upload DMG to release
        if: startsWith(github.ref, 'refs/tags/') && steps.dmg.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" airclone-macos.dmg --clobber --repo "$GITHUB_REPOSITORY"
      - name: Warn if not notarized
        if: steps.notarize.outcome != 'success'
        run: |
          echo "::warning::macOS build was signed but NOT notarized (missing notary creds, Apple outage, or timeout). The published zip is Developer-ID-signed only — re-run this job once the notary service recovers to staple + publish the DMG."

  android:
    runs-on: ubuntu-latest
    needs: release
    if: ${{ !cancelled() && (needs.release.result == 'success' || github.event_name == 'workflow_dispatch') }}
    # Android APK build, fixed after being red since alpha.3. Two parts:
    #  1) This job needs the Rust toolchain (below): super_native_extensions /
    #     irondash_engine_context compile a Rust crate via cargokit for the Android
    #     ABIs, so cargo must be on PATH (rustup adds the *-linux-android targets).
    #  2) The android module is pinned to AGP 8.9.1 / Gradle 8.11.1 (see
    #     android/settings.gradle.kts + gradle-wrapper.properties) because cargokit's
    #     Gradle plugin calls Project.exec(), which Gradle 9 removed — and Flutter
    #     3.44's template defaults to Gradle 9 / AGP 9.
    # Temurin 17 (this job's JDK) supplies the jlink AGP's JdkImageTransform needs.
    # The "Build rclone engine" step (alpha.84) bundles rclone as a per-ABI jniLib
    # so the app works on-device; release signing (alpha.86) uses AIRCLONE_* secrets.
    env:
      # RCLONE_VERSION is workflow-level (see the top of this file). The Android
      # jniLib is built from it via `go get github.com/rclone/rclone@$RCLONE_VERSION`.
      NDK_VERSION: 28.2.13676358
      NDK_API: 24
      # Release signing. Base64-encoded keystore is job-level so the decode
      # step's `if:` can test it; empty on forks (which then debug-sign).
      AIRCLONE_KEYSTORE_BASE64: ${{ secrets.AIRCLONE_KEYSTORE_BASE64 }}
      # Google Play auto-submission credential (a GCP service-account JSON
      # granted release rights in Play Console → API access). Empty on forks
      # and until the secret is configured — the Play steps then no-op.
      HAS_PLAY_CREDS: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v5
      # Fail fast on a real (tagged) release if the signing secret is missing,
      # rather than debug-signing the APK and publishing it — a debug-signed
      # "release" carries an ephemeral/unknown key and can't update in place over
      # a previously release-signed install (INSTALL_FAILED_UPDATE_INCOMPATIBLE).
      # Untagged/dispatch runs and forks are unaffected (they debug-sign by design).
      - name: Require release signing on tagged builds
        if: startsWith(github.ref, 'refs/tags/') && env.AIRCLONE_KEYSTORE_BASE64 == ''
        run: |
          echo "::error::Tagged release but AIRCLONE_KEYSTORE_BASE64 secret is missing — refusing to publish a debug-signed APK."
          exit 1
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: 3.47.0, cache: true }
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v6
        # cache:false — there is no committed go.sum (the pinning module is
        # synthesized in /tmp at build time), so the default cache lookup would
        # warn on every run and cache nothing.
        with: { go-version: stable, cache: false }
      # The Android engine: rclone cross-compiled per ABI into jniLibs as a
      # (fake) shared library named librclone.so. useLegacyPackaging in
      # build.gradle.kts extracts it to nativeLibraryDir at install, the one
      # location Android permits exec() from — the app spawns `librclone.so
      # rcd` exactly like the desktop engine. CGO on (C resolver + system
      # certs); tags: noselfupdate (self-update can't replace an APK payload).
      - name: Build rclone engine for Android ABIs
        run: |
          # Pin the NDK (matches the local toolchain) instead of trusting
          # whatever "latest" the runner image ships.
          echo y | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;${NDK_VERSION}" >/dev/null
          NDK_BIN="$ANDROID_HOME/ndk/${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$NDK_BIN/aarch64-linux-android${NDK_API}-clang" || { echo "NDK toolchain missing at $NDK_BIN"; exit 1; }
          mkdir -p /tmp/rclone-build && cd /tmp/rclone-build
          go mod init rclone-android-build
          go get github.com/rclone/rclone@${RCLONE_VERSION}
          JNI="$GITHUB_WORKSPACE/app/android/app/src/main/jniLibs"
          build() { # <abi> <goarch> <cc-prefix> [GOARM]
            mkdir -p "$JNI/$1"
            GOOS=android GOARCH=$2 CGO_ENABLED=1 GOARM=${4:-} \
            CC="$NDK_BIN/$3${NDK_API}-clang" \
            CGO_LDFLAGS='-fuse-ld=lld -Wl,--hash-style=both -s' \
            go build -tags 'android noselfupdate' -trimpath \
              -ldflags '-s -w -buildid=' \
              -o "$JNI/$1/librclone.so" github.com/rclone/rclone
          }
          build arm64-v8a   arm64 aarch64-linux-android
          build armeabi-v7a arm   armv7a-linux-androideabi 7
          build x86_64      amd64 x86_64-linux-android
          ls -lh "$JNI"/*/librclone.so
      - run: flutter pub get
      # Decode the release keystore and export the AIRCLONE_* env vars that
      # build.gradle.kts reads. Skipped when the secret is absent (forks / PRs),
      # in which case gradle falls back to debug signing. GitHub masks the
      # secret values written to $GITHUB_ENV in the logs.
      - name: Decode release keystore
        if: env.AIRCLONE_KEYSTORE_BASE64 != ''
        run: |
          echo "$AIRCLONE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/airclone-release.jks"
          {
            echo "AIRCLONE_KEYSTORE=$RUNNER_TEMP/airclone-release.jks"
            echo "AIRCLONE_KEYSTORE_PASSWORD=${{ secrets.AIRCLONE_KEYSTORE_PASSWORD }}"
            echo "AIRCLONE_KEY_ALIAS=${{ secrets.AIRCLONE_KEY_ALIAS }}"
            echo "AIRCLONE_KEY_PASSWORD=${{ secrets.AIRCLONE_KEY_PASSWORD }}"
          } >> "$GITHUB_ENV"
      # Split per ABI: rclone is ~76 MB per ABI, so per-ABI APKs keep the download
      # small. Virtually every modern phone wants arm64-v8a.
      - run: flutter build apk --release --split-per-abi
      - name: Rename APKs
        run: |
          cd build/app/outputs/flutter-apk
          for abi in arm64-v8a armeabi-v7a x86_64; do
            mv "app-$abi-release.apk" "airclone-android-$abi.apk"
          done
      # ALSO build a single UNIVERSAL APK (every ABI in one file) for catalogues
      # and stores that take one APK rather than per-ABI splits — e.g. F-Droid,
      # Obtainium, or a plain sideload where the user shouldn't have to pick an
      # ABI. It's ~3x the size of a per-ABI APK (bundling all three rclone
      # engines), so the per-ABI files above stay the recommended download; this
      # is the convenience artifact for single-APK channels. Runs after the split
      # build (both reuse the compiled native libs); its output is app-release.apk,
      # which doesn't collide with the already-renamed per-ABI files.
      - run: flutter build apk --release
      - name: Rename universal APK
        run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/airclone-android-universal.apk
      - uses: actions/upload-artifact@v6
        with:
          name: airclone-android-apk
          # Glob catches the per-ABI files AND airclone-android-universal.apk.
          path: app/build/app/outputs/flutter-apk/airclone-android-*.apk
      # Google Play upload artifact: Play only accepts App Bundles (.aab) for
      # new apps and generates per-device APKs (incl. per-ABI engine splits)
      # server-side. Signed with the same keystore, which acts as the Play
      # UPLOAD key under Play App Signing. Kept as a workflow artifact only —
      # it is for the Play Console, not for end users (they get the APKs).
      - run: flutter build appbundle --release
      - uses: actions/upload-artifact@v6
        with:
          name: airclone-playstore-aab
          path: app/build/app/outputs/bundle/release/app-release.aab
      # ── Google Play submission (internal track) ──────────────────────────
      # Runs only on a tagged release when PLAY_SERVICE_ACCOUNT_JSON exists.
      # The FIRST app listing had to be uploaded manually in the Play Console;
      # every automated push after it must carry a HIGHER versionCode than
      # that manual upload (pubspec build number strictly increases per
      # release, so this holds as long as tags keep bumping it).
      # Play wants short plain-text notes (max 500 chars/locale), not our
      # markdown release file — distill dev/releases/<tag>.md down.
      - name: Prepare Play release notes (plain text, <=500 chars)
        if: startsWith(github.ref, 'refs/tags/') && env.HAS_PLAY_CREDS == 'true'
        working-directory: .
        run: |
          set -euo pipefail
          mkdir -p distribution/whatsnew
          notes="dev/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then
            grep -vE '^\s*(#|\||-{3,})' "$notes" | sed '/^\s*$/d' \
              | head -c 480 > distribution/whatsnew/whatsnew-en-US
          else
            printf 'Airclone %s — see the GitHub release for full notes.' \
              "$GITHUB_REF_NAME" > distribution/whatsnew/whatsnew-en-US
          fi
      - name: Upload AAB to Google Play (internal track)
        if: startsWith(github.ref, 'refs/tags/') && env.HAS_PLAY_CREDS == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.gigaionllc.airclone
          # Paths here are repo-root-relative — this action does not honor
          # defaults.run.working-directory.
          releaseFiles: app/build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
          releaseName: ${{ github.ref_name }}
          whatsNewDirectory: distribution/whatsnew
          # changesNotSentForReview: true  # ONLY if the first automated run
          # fails with "changes cannot be sent for review automatically";
          # remove again once a reviewed release exists (it then errors the
          # other way). Production promotion is a follow-up lane — never
          # auto-push pre-release tags past the internal track.
      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # End users install the per-ABI APKs. The Play App Bundle (.aab) is the
          # Play CONSOLE upload artifact — attached here (with a clear name) as a
          # convenience for manual upload. It carries no private signing key (Play
          # App Signing re-signs server-side), so publishing it is safe; once
          # PLAY_SERVICE_ACCOUNT_JSON is set the CI auto-submits it and this asset
          # is just a mirror.
          cp build/app/outputs/bundle/release/app-release.aab airclone-playstore.aab
          gh release upload "$GITHUB_REF_NAME" \
            build/app/outputs/flutter-apk/airclone-android-*.apk \
            airclone-playstore.aab \
            --clobber --repo "$GITHUB_REPOSITORY"
