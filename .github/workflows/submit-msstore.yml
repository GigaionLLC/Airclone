name: Submit to Microsoft Store

# Sends an already-built MSIX to the Microsoft Store for certification — from the
# Actions tab, with no Partner Center clicking.
#
# Why manual, like promote-play.yml: Microsoft certification takes DAYS, and this
# app has already lost review cycles to package-identity rejections and a policy
# 10.2.5 rejection. Tagging builds and publishes the MSIX as a release asset;
# deciding it is worth a review cycle is a human call.
#
# It does NOT rebuild. It downloads the exact `airclone.msix` that was signed and
# attached to the chosen release, so what gets certified is what was tested.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag whose airclone.msix to submit (e.g. v0.6.7)'
        required: true
        type: string
      dry_run:
        description: 'Check credentials and the package, submit nothing'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  submit:
    # windows-latest because MSStore.CLI targets the Windows packaging stack.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Refuse without credentials
        shell: bash
        env:
          HAS_STORE_CREDS: ${{ secrets.STORE_CLIENT_SECRET != '' && vars.STORE_APP_ID != '' }}
        run: |
          if [ "$HAS_STORE_CREDS" != "true" ]; then
            echo "::error::Store credentials are not configured — see dev/msstore-ci-setup.md."
            exit 1
          fi

      - name: Download the MSIX from the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release download "${{ inputs.tag }}" --repo "$GITHUB_REPOSITORY" \
            --pattern 'airclone.msix' --dir .
          ls -l airclone.msix
          # A zero-byte or missing package would otherwise reach Partner Center and
          # burn a review cycle on something we could have caught here.
          test -s airclone.msix

      # Microsoft retired the `MSStore.CLI` dotnet tool from NuGet — `dotnet tool
      # install` now dies with "msstore.cli is not found in NuGet feeds". The CLI
      # itself is alive and shipping (microsoft/msstore-cli, release binaries);
      # this is the vendor's own installer for it, and it runs on Node 24, so it
      # does not reintroduce the deprecation warning of AGENT.md §8.
      # The action was renamed from microsoft/setup-msstore-cli — that name still
      # redirects, but pin the current one so a future redirect drop is not our
      # publishing lane breaking.
      - name: Install the Store CLI
        uses: microsoft/microsoft-store-apppublisher@v1.4

      - name: Configure credentials
        shell: pwsh
        env:
          MSSTORE_TENANT: ${{ secrets.STORE_TENANT_ID }}
          MSSTORE_CLIENT: ${{ secrets.STORE_CLIENT_ID }}
          MSSTORE_SECRET: ${{ secrets.STORE_CLIENT_SECRET }}
          MSSTORE_SELLER: ${{ secrets.STORE_SELLER_ID }}
        run: |
          msstore reconfigure --tenantId $env:MSSTORE_TENANT --sellerId $env:MSSTORE_SELLER `
            --clientId $env:MSSTORE_CLIENT --clientSecret $env:MSSTORE_SECRET

      - name: Verify the credential actually reaches Partner Center
        shell: pwsh
        run: |
          # The CLI evolves and this wiring predates the setup — print the real
          # surface into the log so a flag change is visible at the point it
          # breaks, not guessed at later. This has to run AFTER reconfigure:
          # even `--help` on a subcommand exits 1 with "SellerId is not set"
          # when the CLI has no configuration.
          msstore --version
          msstore publish --help

          # `reconfigure` only writes the values to local config — it proves
          # nothing about whether they work. This read-only call is what makes a
          # dry run meaningful: it fails here if the Entra app is missing, the
          # secret has lapsed, the tenant is not associated with the Partner
          # Center account, or the app lacks the Manager role.
          msstore apps list

      - name: Submit
        if: ${{ inputs.dry_run != true }}
        shell: pwsh
        run: msstore publish airclone.msix --appId ${{ vars.STORE_APP_ID }}

      - name: Dry run — what would have happened
        if: ${{ inputs.dry_run == true }}
        shell: pwsh
        run: |
          Write-Output "DRY RUN. The credential works, and airclone.msix from ${{ inputs.tag }} is present."
          Write-Output "Re-run with 'Dry run' unchecked to submit it for certification."
