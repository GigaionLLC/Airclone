name: Submit to Microsoft Store

# Sends an already-built MSIX to the Microsoft Store for certification — from the
# Actions tab, with no Partner Center clicking.
#
# Why manual, like promote-play.yml: Microsoft certification takes DAYS, and this
# app has already lost review cycles to package-identity rejections and a policy
# 10.2.5 rejection. Tagging builds and publishes the MSIX as a release asset;
# deciding it is worth a review cycle is a human call.
#
# It does NOT rebuild. It downloads the exact `airclone.msix` that was signed and
# attached to the chosen release, so what gets certified is what was tested.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag whose airclone.msix to submit (e.g. v0.6.7)'
        required: true
        type: string
      mode:
        description: 'dry-run = look only · stage = upload but leave it a draft for a human to submit · submit = full automatic submission'
        required: true
        default: 'dry-run'
        type: choice
        options: [dry-run, stage, submit]
      delete_pending:
        description: 'Delete an existing pending submission first (it may be a hand-made listing edit — check Partner Center)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  submit:
    # windows-latest because the identity check reads AppxManifest.xml with the
    # Windows packaging stack. The submission itself is plain HTTPS and would run
    # anywhere.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Refuse without credentials
        shell: bash
        env:
          HAS_STORE_CREDS: ${{ secrets.STORE_CLIENT_SECRET != '' && vars.STORE_APP_ID != '' }}
        run: |
          if [ "$HAS_STORE_CREDS" != "true" ]; then
            echo "::error::Store credentials are not configured — see dev/msstore-ci-setup.md."
            exit 1
          fi

      - name: Download the MSIX from the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release download "${{ inputs.tag }}" --repo "$GITHUB_REPOSITORY" \
            --pattern 'airclone.msix' --dir .
          ls -l airclone.msix
          # A zero-byte or missing package would otherwise reach Partner Center and
          # burn a review cycle on something we could have caught here.
          test -s airclone.msix

      # Package-identity mismatches have cost this app four review cycles (v0.6.0),
      # and Partner Center validates the four identity fields in a fixed order so
      # the first failure MASKS the rest — you fix one, resubmit, wait days, and
      # discover the next. The MSIX carries its identity in AppxManifest.xml, so
      # check it against the repo variables that were supposed to produce it here,
      # where being wrong costs seconds instead of days.
      - name: Verify the package identity before spending a review cycle
        shell: pwsh
        env:
          EXPECT_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          EXPECT_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path airclone.msix))
          try {
            $entry = $zip.Entries | Where-Object { $_.FullName -eq 'AppxManifest.xml' }
            if (-not $entry) { throw "AppxManifest.xml not found inside airclone.msix" }
            $reader = New-Object System.IO.StreamReader($entry.Open())
            $xml = [xml]$reader.ReadToEnd()
            $reader.Dispose()
          } finally { $zip.Dispose() }

          $id = $xml.Package.Identity
          Write-Output "Package identity:"
          Write-Output "  Name      = $($id.Name)"
          Write-Output "  Publisher = $($id.Publisher)"
          Write-Output "  Version   = $($id.Version)"

          $bad = $false
          if ($env:EXPECT_NAME -and $id.Name -ne $env:EXPECT_NAME) {
            Write-Output "::error::Identity Name is '$($id.Name)' but MSIX_IDENTITY_NAME is '$($env:EXPECT_NAME)'."
            $bad = $true
          }
          if ($env:EXPECT_PUBLISHER -and $id.Publisher -ne $env:EXPECT_PUBLISHER) {
            Write-Output "::error::Identity Publisher is '$($id.Publisher)' but MSIX_PUBLISHER is '$($env:EXPECT_PUBLISHER)'."
            $bad = $true
          }
          # A build with the identity variables unset still produces a package —
          # carrying pubspec placeholders — and that is what Partner Center rejected.
          if ($id.Name -match 'placeholder' -or $id.Publisher -match 'placeholder') {
            Write-Output "::error::This package carries pubspec PLACEHOLDER identity, not the reserved identity."
            $bad = $true
          }
          if ($bad) { exit 1 }

      # NOT `msstore publish`. The Microsoft Store Developer CLI refuses to update
      # a paid product — "App updates are supported only for Free products" — and
      # Airclone carries the Store listing price that funds its signing certs. It
      # gets far enough to CREATE a submission before saying so, so the CLI also
      # leaves a pending draft behind on every failed attempt. The REST API it
      # sits on has no such restriction. See dev/msstore-ci-setup.md.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: bash
        run: pip install --disable-pip-version-check requests

      # Dry run authenticates and reads the app's real state without creating
      # anything; --commit is what makes it a submission.
      - name: Submit to the Store
        shell: bash
        env:
          STORE_TENANT_ID: ${{ secrets.STORE_TENANT_ID }}
          STORE_CLIENT_ID: ${{ secrets.STORE_CLIENT_ID }}
          STORE_CLIENT_SECRET: ${{ secrets.STORE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          ARGS=""
          case "${{ inputs.mode }}" in
            submit) ARGS="$ARGS --commit" ;;
            stage)  ARGS="$ARGS --stage" ;;
          esac
          if [ "${{ inputs.delete_pending }}" = "true" ]; then ARGS="$ARGS --delete-pending"; fi
          python tool/store_submit.py \
            --app-id "${{ vars.STORE_APP_ID }}" \
            --package airclone.msix $ARGS

