name: Mac App Store (sandbox verify)

# Builds Airclone as a MAC APP STORE build and RUNS it, sandboxed, on a real Mac.
#
# Why this exists: nobody on this project owns a Mac. But a GitHub `macos-latest`
# runner IS a real Mac, and - crucially - the App Sandbox is enforced by the code
# signature plus the entitlement, NOT by the App Store. So an ad-hoc signature
# with MacAppStore.entitlements gives us the same sandbox a customer would get,
# and a denied file read fails here exactly as it would for them.
#
# That makes the biggest MAS unknown - "what breaks under the sandbox?" -
# answerable without hardware, which is the whole point. See
# dev/plans/apple-appstore-plan.md Gate C3.
#
# What it does NOT do: submit anything, sign with a real identity, or need any
# Apple secret. It is pure verification. Distribution lives in release.yml.

on:
  workflow_dispatch:
    inputs:
      run_seconds:
        description: 'How long to let the app run before capturing'
        required: true
        default: '25'
        type: string
  push:
    paths:
      - 'app/lib/src/state/build_flavor.dart'
      - 'app/lib/src/state/native_actions_policy.dart'
      - 'app/lib/src/state/mount_policy.dart'
      - 'app/lib/src/state/serve_policy.dart'
      - 'app/lib/src/state/mac_bookmarks.dart'
      - 'app/lib/src/state/local_locations.dart'
      # Engine resolution: the MAS build is forced in-process, and both of
      # these decide what that means. A change here that broke the sandboxed
      # build would otherwise only show up on a real Mac.
      - 'app/lib/src/rclone/rclone_engine.dart'
      - 'packages/airclone_rc/lib/src/librclone_ffi.dart'
      # Any native macOS change: Swift cannot be compiled off a Mac, so this
      # workflow IS the compiler for it. A Swift file missing from
      # project.pbxproj also fails here rather than silently never building.
      - 'app/macos/**'
      # The sandboxed sign-in probe and everything it exercises. Binding the
      # OAuth redirect listener is the one thing the App Sandbox can refuse
      # that would silently cost every Mac App Store copy the ability to add a
      # cloud at all.
      - 'app/tool/mas_oauth_probe.dart'
      - 'packages/airclone_rc/lib/src/oauth_flow.dart'
      - '.github/workflows/mas-verify.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: app

jobs:
  sandbox-verify:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2.23.0
        with: { channel: stable, flutter-version: 3.47.0, cache: true }
      - uses: actions/setup-go@v7
        # cache:false - there is no committed go.sum (the build script synthesizes
        # the pinning module in /tmp), so the default lookup would cache nothing
        # and warn on every run.
        with: { go-version: 'stable', cache: false }

      - name: Build librclone (the ONLY legal engine in a sandboxed build)
        working-directory: .
        run: bash dev/desktop/build-librclone.sh

      - run: flutter config --enable-macos-desktop
      - run: flutter pub get

      - name: Build the Mac App Store flavour
        # AIRCLONE_MAS is what flips kMacAppStoreBuild, which forces the
        # in-process engine and gates off mount/serve/archive/reveal. Building
        # WITHOUT it but signing WITH the sandbox entitlement would produce an
        # app that tries to spawn rclone and is killed - so the two must always
        # travel together.
        run: flutter build macos --release --dart-define=AIRCLONE_MAS=true

      - name: Bundle librclone into the app
        run: |
          set -euo pipefail
          APP="build/macos/Build/Products/Release/Airclone.app"
          test -f macos/librclone/librclone.dylib
          mkdir -p "$APP/Contents/Frameworks"
          cp macos/librclone/librclone.dylib "$APP/Contents/Frameworks/librclone.dylib"
          lipo -info "$APP/Contents/Frameworks/librclone.dylib"

      - name: Build the sign-in probe as a sandboxed app of its own
        # It gets its OWN .app rather than riding inside Airclone.app, because
        # the App Sandbox needs a container and a container comes from a bundle
        # identifier. A bare Mach-O signed with `app-sandbox` and nothing else
        # is killed at launch with SIGTRAP before main() runs - which is what
        # the first version of this step did, and it proved nothing.
        #
        # The layout mirrors a real app on purpose: the probe in Contents/MacOS
        # and librclone in Contents/Frameworks, so defaultLibrclonePath()
        # resolves it exactly as the shipping app does.
        run: |
          set -euo pipefail
          PROBE="build/macos/SignInProbe.app"
          rm -rf "$PROBE"
          mkdir -p "$PROBE/Contents/MacOS" "$PROBE/Contents/Frameworks"
          dart compile exe tool/mas_oauth_probe.dart -o "$PROBE/Contents/MacOS/probe"
          chmod +x "$PROBE/Contents/MacOS/probe"
          cp macos/librclone/librclone.dylib "$PROBE/Contents/Frameworks/librclone.dylib"
          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0">' \
            '<dict>' \
            '  <key>CFBundleIdentifier</key><string>com.gigaionllc.airclone.signinprobe</string>' \
            '  <key>CFBundleName</key><string>SignInProbe</string>' \
            '  <key>CFBundleExecutable</key><string>probe</string>' \
            '  <key>CFBundlePackageType</key><string>APPL</string>' \
            '  <key>CFBundleShortVersionString</key><string>1.0</string>' \
            '  <key>CFBundleVersion</key><string>1</string>' \
            '</dict>' \
            '</plist>' > "$PROBE/Contents/Info.plist"
          plutil -lint "$PROBE/Contents/Info.plist"

          # Inside-out, and with the SAME entitlements the store build carries -
          # which is the whole point of the exercise.
          codesign --force --timestamp=none -s - "$PROBE/Contents/Frameworks/librclone.dylib"
          codesign --force --timestamp=none \
            --entitlements macos/Runner/MacAppStore.entitlements \
            -s - "$PROBE"
          codesign --verify --strict --verbose=2 "$PROBE"
          echo "--- entitlements on the probe ---"
          codesign -d --entitlements - "$PROBE" || true

      - name: Sign ad-hoc WITH the sandbox entitlement
        # The signature is ad-hoc (`-s -`), which is all that is needed for the
        # kernel to enforce the sandbox. Inside-out, per Apple's guidance: every
        # Mach-O leaf first, then the bundle, so the outer signature seals the
        # inner ones.
        run: |
          set -euo pipefail
          APP="build/macos/Build/Products/Release/Airclone.app"
          find "$APP/Contents/Frameworks" -type f \( -name '*.dylib' -o -name '*.so' \) \
            -exec codesign --force --timestamp=none -s - {} \; 2>/dev/null || true
          find "$APP/Contents/Frameworks" -type d -name '*.framework' \
            -exec codesign --force --timestamp=none -s - {} \; 2>/dev/null || true
          codesign --force --timestamp=none \
            --entitlements macos/Runner/MacAppStore.entitlements \
            -s - "$APP"
          echo "--- entitlements actually embedded ---"
          codesign -d --entitlements - "$APP" || true
          codesign --verify --strict --verbose=2 "$APP"

      - name: Confirm the sandbox is really on
        # A build that silently lost the entitlement would pass every other check
        # in this job while proving nothing, so assert it explicitly.
        run: |
          set -euo pipefail
          APP="build/macos/Build/Products/Release/Airclone.app"
          if codesign -d --entitlements - "$APP" 2>&1 | grep -q 'app-sandbox'; then
            echo "app-sandbox entitlement present"
          else
            echo "::error::the app-sandbox entitlement is MISSING - this run proves nothing"
            exit 1
          fi

      - name: Can a sandboxed build bind the sign-in listener?
        # THE Mac App Store question this feature raises. Completing an OAuth
        # sign-in means rclone listens on 127.0.0.1:53682 for the provider's
        # redirect, and the sandbox refuses to listen() at all without
        # com.apple.security.network.server. Having the entitlement in the file
        # is not the same as the listener binding, and only one of those is
        # worth anything to a customer.
        #
        # Exit codes are read rather than trusted as pass/fail: 4 and 5 mean the
        # listener was REFUSED, which is a real finding and fails this job.
        # Anything else non-zero means the probe could not run (a bare Mach-O
        # carrying app-sandbox may not get a container), which proves nothing
        # either way and is reported as such rather than blocking the pipeline
        # on it.
        run: |
          # `set +e` EXPLICITLY. GitHub runs every `run:` block as `bash -e {0}`,
          # so a failing probe aborts the step before the exit code below can be
          # read - which turned the first run's inconclusive crash into a hard
          # failure that said nothing about the sandbox.
          set +e
          set -u -o pipefail
          PROBE="build/macos/SignInProbe.app/Contents/MacOS/probe"
          mkdir -p ../artifacts
          "$PROBE" 2>&1 | tee ../artifacts/mas-oauth-probe.txt
          CODE=${PIPESTATUS[0]}
          echo "probe exit=$CODE"
          if [ "$CODE" = "0" ]; then
            echo "the sandboxed build CAN bind the sign-in listener"
          elif [ "$CODE" = "4" ] || [ "$CODE" = "5" ]; then
            echo "::error::the App Sandbox refused the OAuth listener - a Mac App Store build cannot add a cloud. Check com.apple.security.network.server in MacAppStore.entitlements."
            exit 1
          else
            # 133 is SIGTRAP, which on a sandboxed binary means the container
            # could not be established: the process died before any of our code
            # ran, so it says nothing about the listener either way.
            echo "::warning::the sign-in probe did not run to a verdict (exit $CODE) - this run proves nothing about the sandbox and the listener still needs checking by hand"
            echo "--- anything the log has to say about it ---"
            log show --last 3m --style compact \
              --predicate 'eventMessage CONTAINS "signinprobe"' 2>/dev/null \
              | tail -20 || true
          fi

      - name: Run it, and watch for sandbox denials
        # `log stream` is started FIRST so it cannot miss an early denial. The app
        # is launched detached; we let it settle, screenshot it, then stop.
        env:
          RUN_SECONDS: ${{ inputs.run_seconds || '25' }}
        run: |
          set -uo pipefail
          APP="build/macos/Build/Products/Release/Airclone.app"
          mkdir -p ../artifacts

          log stream --style compact --predicate \
            'senderImagePath CONTAINS "Sandbox" OR eventMessage CONTAINS "deny("' \
            > ../artifacts/sandbox-log.txt 2>&1 &
          LOG_PID=$!

          # NOT `open -a`: that resolves its argument as an application NAME via
          # LaunchServices and fails on a path ("Unable to find application
          # named ..."). Plain `open` on an ABSOLUTE .app path is the correct form.
          open "$PWD/$APP" || echo "::warning::open returned non-zero"
          sleep "$RUN_SECONDS"

          if pgrep -f "Airclone.app/Contents/MacOS/Airclone" > /dev/null; then
            echo "the app is still running after ${RUN_SECONDS}s"
            echo "ALIVE=yes" >> "$GITHUB_ENV"
          else
            echo "::warning::the app is NOT running - it exited or never started"
            echo "ALIVE=no" >> "$GITHUB_ENV"
          fi

          screencapture -x ../artifacts/screen.png || \
            echo "::warning::screencapture failed (no window server?)"

          kill "$LOG_PID" 2>/dev/null || true
          pkill -f "Airclone.app/Contents/MacOS/Airclone" 2>/dev/null || true

      - name: Report sandbox denials
        # Denials are the POINT of this job, not a failure: the first runs are
        # expected to show them, and the list is the to-do for the bookmark work.
        # They are surfaced loudly rather than failing the build, so the artifacts
        # always upload.
        run: |
          set -uo pipefail
          LOG=../artifacts/sandbox-log.txt
          # The stream captures every denial on the machine, and a CI runner is
          # full of unrelated daemons (siriknowledged, businessservicesd, ...).
          # Only OUR denials mean anything, and the denial format is
          # `Sandbox: <proc>(<pid>) deny(...)` - so match on "Airclone(" with the
          # paren, which excludes other processes merely touching our .app path.
          # The full log still ships as an artifact for context.
          if [ -s "$LOG" ] && grep -q 'Airclone(' "$LOG"; then
            echo "::warning::AIRCLONE sandbox denials recorded - this is the bookmark to-do list"
            grep 'Airclone(' "$LOG" | sed 's/^/  /' | head -40
          else
            echo "no denials from Airclone itself in this run"
            echo "(unrelated system-daemon denials are expected on a CI runner and are ignored)"
          fi
          echo "app still alive after the run window: ${ALIVE:-unknown}"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mas-sandbox-verify
          path: |
            artifacts/screen.png
            artifacts/sandbox-log.txt
            artifacts/mas-oauth-probe.txt
          if-no-files-found: warn
