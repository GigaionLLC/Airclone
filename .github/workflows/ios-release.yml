name: iOS App Store (build + upload)

# Builds the iOS App Store archive and uploads it to App Store Connect, where it
# becomes a TestFlight build.
#
# Same shape as mas-release.yml and for the same reason: DISPATCH-ONLY, and it
# submits nothing. A human attaches the build to a version and presses "Add for
# Review". On the Microsoft Store a machine was once allowed to commit a
# submission and published this app at $0, unstoppable once started - see
# AGENT.md rules 10-13.
#
# Two things are EASIER here than on macOS, both because the engine is a static
# archive rather than a dylib:
#   - nothing has to be copied into the bundle after archiving, so there is no
#     re-sign dance to make the outer signature cover the engine;
#   - there is no library for the App Store to reject as an invalid bundle
#     structure. The xcframework is linked, never embedded.
#
# One thing is HARDER: iOS App Store signing needs its own Apple Distribution
# certificate and an "iOS App Store" provisioning profile. The Mac lane's certs
# (3rd Party Mac Developer *) do not cover iOS.
#
# mode:
#   dry-run   build and archive with NO signing identity and NO Apple secret.
#             Proves the DEVICE slice links and keeps its symbols, which the
#             simulator job in ios-verify.yml cannot tell you.
#   validate  ask Apple whether it would accept the .ipa. Changes nothing.
#   upload    send it. Becomes a TestFlight build; submits nothing.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run = build only, no secrets | validate = ask Apple | upload = send it'
        required: true
        default: dry-run
        type: choice
        options: [dry-run, validate, upload]
      build_number:
        description: 'Override CFBundleVersion (blank = pubspec). Needed to re-upload.'
        required: false
        type: string
      signing:
        description: 'secrets = stored p12 | ephemeral = mint+revoke per run | automatic = Xcode (does NOT work, see notes)'
        required: true
        default: secrets
        type: choice
        options: [secrets, ephemeral, automatic]

permissions:
  contents: read

defaults:
  run:
    working-directory: app

jobs:
  build-upload:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: 3.47.0, cache: true }
      - uses: actions/setup-go@v6
        with: { go-version: 'stable', cache: false }

      - name: Refuse without credentials
        # dry-run deliberately needs none, so it stays usable as a pure link
        # check. Anything that talks to Apple fails here rather than 40 minutes
        # later at the upload step.
        if: ${{ inputs.mode != 'dry-run' }}
        env:
          HAS_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY != '' }}
          ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
          KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          HAS_DIST: ${{ secrets.APPLE_IOS_DIST_P12_BASE64 != '' }}
          HAS_PROFILE: ${{ secrets.APPLE_IOS_PROVISIONING_PROFILE_BASE64 != '' }}
        run: |
          set -euo pipefail
          missing=""
          [ "$HAS_KEY" = "true" ] || missing="$missing APPSTORE_API_PRIVATE_KEY(secret)"
          [ -n "$ISSUER" ] || missing="$missing APPSTORE_ISSUER_ID(secret)"
          [ -n "$KEY_ID" ] || missing="$missing APPSTORE_API_KEY_ID(var)"
          [ -n "$TEAM_ID" ] || missing="$missing APPLE_TEAM_ID(secret)"
          if [ "${{ inputs.signing }}" = "secrets" ]; then
            [ "$HAS_DIST" = "true" ] || missing="$missing APPLE_IOS_DIST_P12_BASE64(secret)"
            [ "$HAS_PROFILE" = "true" ] || missing="$missing APPLE_IOS_PROVISIONING_PROFILE_BASE64(secret)"
          fi
          if [ -n "$missing" ]; then
            echo "::error::missing:$missing - see dev/plans/apple-appstore-plan.md Gate B/D"
            exit 1
          fi
          echo "credentials present"

      - name: Build librclone for iOS
        working-directory: .
        run: bash dev/ios/build-librclone-ios.sh

      - name: Write the App Store Connect API key
        if: ${{ inputs.mode != 'dry-run' }}
        env:
          P8: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          chmod 700 "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$P8" > "$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8"
          echo "key written, $(wc -c < "$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8") bytes"

      - name: Import the distribution certificate and profile
        # An ephemeral, job-scoped keychain: the runner's login keychain is
        # locked, and a locked keychain makes signing report "0 valid identities
        # found" with no error of its own. That cost several runs on the Mac lane.
        if: ${{ inputs.mode != 'dry-run' && inputs.signing == 'secrets' }}
        env:
          DIST_P12: ${{ secrets.APPLE_IOS_DIST_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_IOS_P12_PASSWORD }}
          PROFILE: ${{ secrets.APPLE_IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KC="$RUNNER_TEMP/airclone-ios.keychain-db"
          security create-keychain -p "" "$KC"
          security set-keychain-settings -lut 7200 "$KC"
          security unlock-keychain -p "" "$KC"
          security list-keychains -d user -s "$KC" login.keychain-db
          security default-keychain -s "$KC"
          printf '%s' "$DIST_P12" | base64 -d > "$RUNNER_TEMP/ios-dist.p12"
          security import "$RUNNER_TEMP/ios-dist.p12" -k "$KC" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -A
          rm -f "$RUNNER_TEMP/ios-dist.p12"
          # Without this, codesign blocks on a GUI keychain prompt nobody can
          # answer and the job hangs until it times out.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "" "$KC" > /dev/null
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          printf '%s' "$PROFILE" | base64 -d > "$PROFILE_DIR/Airclone_iOS.mobileprovision"
          echo "--- identities available for signing ---"
          security find-identity -v -p codesigning "$KC"

      - name: Mint a distribution identity for this run only
        # Xcode's cloud signing cannot create an iOS distribution certificate
        # with an App Manager key - "Cloud signing permission error", the same
        # answer macOS gave. The Certificates API can, so this mints one, uses it
        # inside this single job, and revokes it in the always() step at the end.
        # Nothing long-lived is stored: no distribution private key ever leaves
        # the runner, and there is no p12 sitting in a secret waiting to leak.
        if: ${{ inputs.mode != 'dry-run' && inputs.signing == 'ephemeral' }}
        env:
          KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
        working-directory: .
        run: |
          set -euo pipefail
          pip3 install --quiet --break-system-packages cryptography 2>/dev/null             || pip3 install --quiet cryptography
          umask 077
          mkdir -p "$RUNNER_TEMP/ios-signing"
          python3 tool/asc_ios_signing.py             "$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8"             "$KEY_ID" "$ISSUER" --apply --force-new             --out-dir "$RUNNER_TEMP/ios-signing"
          CERT_ID="$(cat "$RUNNER_TEMP/ios-signing/cert-id.txt")"
          echo "EPHEMERAL_CERT_ID=$CERT_ID" >> "$GITHUB_ENV"
          echo "minted certificate $CERT_ID for this run"

      - name: Install the ephemeral identity
        if: ${{ inputs.mode != 'dry-run' && inputs.signing == 'ephemeral' }}
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/ios-signing"
          KC="$RUNNER_TEMP/airclone-ios.keychain-db"
          security create-keychain -p "" "$KC"
          security set-keychain-settings -lut 7200 "$KC"
          security unlock-keychain -p "" "$KC"
          security list-keychains -d user -s "$KC" login.keychain-db
          security default-keychain -s "$KC"
          security import "$D/ios-dist.p12" -k "$KC"             -P "$(cat "$D/p12.password")" -T /usr/bin/codesign -A
          # Without this, codesign blocks on a GUI keychain prompt nobody can
          # answer and the job hangs until it times out.
          security set-key-partition-list -S apple-tool:,apple:,codesign:             -s -k "" "$KC" > /dev/null
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          cp "$D/Airclone_iOS.mobileprovision" "$PROFILE_DIR/"
          echo "--- identities available for signing ---"
          security find-identity -v -p codesigning "$KC"

      - name: Create a keychain for automatically provisioned signing
        # Same lesson as the Mac lane: -allowProvisioningUpdates has nowhere to
        # store a certificate if the login keychain is locked, so it creates
        # none and reports no error - the symptom is "0 valid identities found".
        if: ${{ inputs.mode != 'dry-run' && inputs.signing == 'automatic' }}
        run: |
          set -euo pipefail
          KC="$RUNNER_TEMP/airclone-ios.keychain-db"
          security create-keychain -p "" "$KC"
          security set-keychain-settings -lut 7200 "$KC"
          security unlock-keychain -p "" "$KC"
          security list-keychains -d user -s "$KC" login.keychain-db
          security default-keychain -s "$KC"
          security list-keychains

      - run: flutter pub get

      - name: Generate the Flutter build inputs
        # --no-codesign: this only produces the assets and the ephemeral xcconfig
        # that the xcodebuild archive below consumes. Signing happens there.
        run: flutter build ios --release --no-codesign${{ inputs.build_number && format(' --build-number={0}', inputs.build_number) || '' }}

      - name: Archive
        env:
          ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
          KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          mkdir -p ../artifacts
          # Tee the archive: linker warnings and the actual Ld command lines are
          # the only way to tell "not linked" from "linked then stripped", and
          # they scroll past in a successful build.
          exec > >(tee -a ../artifacts/ios-archive.log) 2>&1
          # Unsigned archive for dry-run AND for automatic signing. On iOS an
          # "Apple Development" archive needs an iOS App Development profile, and
          # generating one requires a REGISTERED DEVICE:
          #
          #   error: Your team has no devices from which to generate a
          #   provisioning profile.
          #
          # Nobody here owns an iPhone, so that path is closed. macOS does not
          # have this constraint, which is why the Mac lane archives as
          # Apple Development and this one cannot. -exportArchive re-signs
          # anyway, so archiving unsigned loses nothing.
          if [ "$MODE" = "dry-run" ] || [ "${{ inputs.signing }}" != "secrets" ]; then
            # No identity, no Apple call. CODE_SIGNING_ALLOWED=NO is what makes
            # an unsigned archive legal; the point of this mode is the LINK.
            xcodebuild -workspace ios/Runner.xcworkspace \
              -scheme Runner -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath "$RUNNER_TEMP/Airclone.xcarchive" \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
              archive
          else
            # "Apple Development" at archive time, distribution applied later by
            # -exportArchive. Naming Distribution here conflicts with automatic
            # signing; omitting it entirely hands control back to the project's
            # own "-" and produces an ad-hoc signature. Both were learned on the
            # Mac lane.
            xcodebuild -workspace ios/Runner.xcworkspace \
              -scheme Runner -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath "$RUNNER_TEMP/Airclone.xcarchive" \
              -allowProvisioningUpdates \
              -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8" \
              -authenticationKeyID "$KEY_ID" \
              -authenticationKeyIssuerID "$ISSUER" \
              CODE_SIGN_STYLE=Automatic \
              DEVELOPMENT_TEAM="$TEAM_ID" \
              "CODE_SIGN_IDENTITY=Apple Development" \
              archive
          fi

      - name: The archived binary must still export the Go symbols
        # See ios-verify.yml for why this matches with awk rather than
        # `grep " T _sym$"`, and why it prints the lines whatever the verdict.
        # In short: -force_load does not survive -dead_strip (hence the
        # -Wl,-u,_Rclone* roots), and nm's type letter is not worth hard-coding.
        run: |
          # `set +e` explicitly. GitHub runs every `run:` block as `bash -e {0}`,
          # so errexit is ALREADY ON and `set -uo pipefail` does not undo it.
          # That has now aborted three separate diagnostics in this lane, each
          # time on a `grep` that legitimately found nothing - which is exactly
          # the case worth reporting.
          set +e
          set -uo pipefail
          APP="$(find "$RUNNER_TEMP/Airclone.xcarchive/Products/Applications" \
            -maxdepth 1 -name '*.app' | head -1)"
          echo "app: $APP"

          defined() {  # file, symbol -> 0 when defined (type is not U)
            nm -g "$1" 2>/dev/null \
              | awk -v s="_$2" '$NF==s && $(NF-1)!="U" {f=1} END{exit !f}'
          }

          HOST=""
          for f in "$APP"/*; do
            [ -f "$f" ] || continue
            file "$f" 2>/dev/null | grep -q Mach-O || continue
            echo "-- $f  ($(stat -f%z "$f") bytes, archs: $(lipo -archs "$f" 2>/dev/null)) --"
            nm -g "$f" 2>/dev/null | grep -i rclone | sed 's/^/   /'
            defined "$f" RcloneRPC && HOST="$f"
          done

          if [ -z "$HOST" ]; then
            echo "::error::no Mach-O in the archived bundle defines _RcloneRPC"
            ls -la "$APP"
            echo "-- how the executable was linked --"
            grep -oE '\-dead_strip|\-force_load [^ ]*librclone[^ ]*|\-u,_Rclone[A-Za-z]*' \
              ../artifacts/ios-archive.log | sort -u | sed 's/^/   /'
            exit 1
          fi
          echo "the engine is linked into: $HOST"

          MISSING=0
          for sym in RcloneInitialize RcloneFinalize RcloneRPC RcloneFreeString; do
            if defined "$HOST" "$sym"; then
              echo "  _${sym} defined"
            else
              echo "::error::_${sym} is NOT defined in the archived device binary"
              MISSING=1
            fi
          done
          exit "$MISSING"

      - name: Export the App Store package
        if: ${{ inputs.mode != 'dry-run' }}
        env:
          ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
          KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE_NAME: ${{ vars.APPLE_IOS_PROFILE_NAME }}
        run: |
          set -euo pipefail
          # MANUAL signing, like the Mac lane: automatic sends Xcode to cloud
          # signing, which cannot mint a distribution certificate with an App
          # Manager key. Everything needed is already in the local keychain.
          {
            echo '<?xml version="1.0" encoding="UTF-8"?>'
            echo '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">'
            echo '<plist version="1.0"><dict>'
            echo '<key>method</key><string>app-store-connect</string>'
            echo '<key>destination</key><string>export</string>'
            echo "<key>teamID</key><string>${TEAM_ID}</string>"
            echo '<key>uploadSymbols</key><true/>'
            if [ "${{ inputs.signing }}" = "ephemeral" ]; then
              echo '<key>signingStyle</key><string>manual</string>'
              echo '<key>signingCertificate</key><string>Apple Distribution</string>'
              echo '<key>provisioningProfiles</key><dict>'
              echo "<key>com.gigaionllc.airclone</key><string>$(cat "$RUNNER_TEMP/ios-signing/profile-name.txt")</string>"
              echo '</dict>'
            elif [ "${{ inputs.signing }}" = "automatic" ]; then
              # The open question this mode exists to answer: can
              # -allowProvisioningUpdates mint an iOS DISTRIBUTION identity with
              # an App Manager key? On macOS it could not - "Cloud signing
              # permission error" - and the Certificates API had to be used
              # instead. Whether iOS behaves the same is worth one CI run rather
              # than an assumption.
              echo '<key>signingStyle</key><string>automatic</string>'
            else
              echo '<key>signingStyle</key><string>manual</string>'
              echo '<key>signingCertificate</key><string>Apple Distribution</string>'
              echo '<key>provisioningProfiles</key><dict>'
              echo "<key>com.gigaionllc.airclone</key><string>${PROFILE_NAME:-Airclone iOS App Store}</string>"
              echo '</dict>'
            fi
            echo '</dict></plist>'
          } > "$RUNNER_TEMP/export.plist"
          echo "--- export options ---"; cat "$RUNNER_TEMP/export.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Airclone.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER"
          ls -lh "$RUNNER_TEMP/export"

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ios-archive-log
          path: app/artifacts/ios-archive.log
          if-no-files-found: warn

      - uses: actions/upload-artifact@v6
        if: ${{ always() && inputs.mode != 'dry-run' }}
        with:
          name: ios-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: warn

      - name: Ask Apple whether it would accept the package
        if: ${{ inputs.mode != 'dry-run' }}
        # A real server-side check of signature, entitlements, profile and bundle
        # identity - and it changes nothing. It runs for upload too, because a
        # rejected validation costs nothing while a half-uploaded build has to be
        # cleaned up in the console by hand.
        env:
          ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
          KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
        run: |
          set -euo pipefail
          IPA=$(ls "$RUNNER_TEMP/export"/*.ipa | head -1)
          echo "validating $IPA"
          xcrun altool --validate-app -f "$IPA" -t ios --apiKey "$KEY_ID" --apiIssuer "$ISSUER"

      - name: Upload to App Store Connect
        if: ${{ inputs.mode == 'upload' }}
        env:
          ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
          KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
        run: |
          set -euo pipefail
          IPA=$(ls "$RUNNER_TEMP/export"/*.ipa | head -1)
          echo "uploading $IPA"
          xcrun altool --upload-app -f "$IPA" -t ios --apiKey "$KEY_ID" --apiIssuer "$ISSUER"

      - name: What happens next
        if: ${{ inputs.mode == 'upload' }}
        run: |
          echo "Uploaded. Processing takes a few minutes, then it appears in TestFlight."
          echo "NOTHING is submitted. Export compliance is asked on the build itself -"
          echo "ITSAppUsesNonExemptEncryption is deliberately absent from Info.plist so"
          echo "a human answers it. See dev/plans/apple-appstore-plan.md Gate C2."
          echo "https://appstoreconnect.apple.com/apps/6790176897/testflight/ios"

      - name: Revoke the ephemeral certificate
        # BEFORE the key is shredded, because revoking needs it. Revoking a
        # DISTRIBUTION certificate does not invalidate a build already uploaded -
        # Apple re-signs for delivery - unlike Developer ID, where revocation
        # breaks notarised apps in the field.
        if: ${{ always() && env.EPHEMERAL_CERT_ID != '' }}
        env:
          KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
        working-directory: .
        run: |
          set -uo pipefail
          python3 tool/asc_ios_signing.py             "$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8"             "$KEY_ID" "$ISSUER" --revoke "$EPHEMERAL_CERT_ID"             || echo "::warning::could not revoke $EPHEMERAL_CERT_ID - revoke it by hand"

      - name: Shred the API key and the keychain
        if: always()
        run: |
          rm -rf "$HOME/.appstoreconnect" || true
          rm -rf "$RUNNER_TEMP/ios-signing" || true
          security delete-keychain "$RUNNER_TEMP/airclone-ios.keychain-db" || true
