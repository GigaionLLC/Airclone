name: Mac App Store (screenshots)

# Captures App Store screenshots of the SANDBOXED build on a real Mac.
#
# Apple accepts only exact sizes for Mac: 1280x800, 1440x900, 2560x1600 or
# 2880x1800. The runner's default display is smaller than all of them, so step
# one is finding out what resolutions it will actually accept - hence the
# diagnostic mode below, which is cheap and answers that before any real capture
# work is built on a guess.
#
# The other hard problem is CONTENT. An empty file manager makes a terrible
# screenshot, and Google already rejected a screenshot from this project for
# looking like placeholder media. A sandboxed app cannot be handed an arbitrary
# folder without a user clicking through NSOpenPanel - but it CAN read anything
# inside its own container, so the demo data and an rclone alias remote pointing
# at it are seeded there.
#
# See dev/plans/apple-appstore-plan.md Gate E.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'diagnose = report what the runner can do | capture = take screenshots'
        required: true
        default: diagnose
        type: choice
        options: [diagnose, capture]

permissions:
  contents: read

defaults:
  run:
    working-directory: app

jobs:
  screenshots:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: What can this runner's display actually do?
        # Everything downstream depends on the answer, and it costs 30 seconds
        # here versus a 15-minute build to find out the hard way.
        run: |
          set -uo pipefail
          echo "--- current display ---"
          system_profiler SPDisplaysDataType 2>/dev/null | grep -iE "resolution|display type|pixel" || true
          echo "--- displayplacer ---"
          brew install displayplacer cliclick > /dev/null 2>&1 || echo "brew install failed"
          displayplacer list 2>/dev/null | grep -iE "^ *mode|res:|Persistent screen id|current mode" | head -40 || \
            echo "displayplacer unavailable"
          echo "--- screencapture sanity ---"
          screencapture -x /tmp/probe.png && \
            python3 -c "import struct;d=open('/tmp/probe.png','rb').read(33);print('captured', struct.unpack('>II', d[16:24]))" || \
            echo "screencapture failed"

      - name: Stop here if only diagnosing
        if: ${{ inputs.mode == 'diagnose' }}
        run: echo "Diagnostic complete - read the step above before building the capture path."

      - uses: subosito/flutter-action@v2
        if: ${{ inputs.mode == 'capture' }}
        with: { channel: stable, flutter-version: 3.47.0, cache: true }
      - uses: actions/setup-go@v6
        if: ${{ inputs.mode == 'capture' }}
        with: { go-version: 'stable', cache: false }

      - name: Build librclone
        if: ${{ inputs.mode == 'capture' }}
        working-directory: .
        run: bash dev/desktop/build-librclone.sh

      - name: Build and ad-hoc sign the sandboxed app
        if: ${{ inputs.mode == 'capture' }}
        # Ad-hoc signing is enough for the kernel to enforce the sandbox, which
        # is the point: these screenshots must show the app customers get, with
        # its Locations sidebar and its missing mount/archive actions, not the
        # roomier DMG build.
        run: |
          set -euo pipefail
          flutter config --enable-macos-desktop
          flutter pub get
          flutter build macos --release --dart-define=AIRCLONE_MAS=true
          APP="build/macos/Build/Products/Release/Airclone.app"
          mkdir -p "$APP/Contents/Frameworks"
          cp macos/librclone/librclone.dylib "$APP/Contents/Frameworks/librclone.dylib"
          find "$APP/Contents/Frameworks" -type f \( -name '*.dylib' -o -name '*.so' \) \
            -exec codesign --force --timestamp=none -s - {} \; 2>/dev/null || true
          codesign --force --timestamp=none \
            --entitlements macos/Runner/MacAppStore.entitlements -s - "$APP"

      - name: Seed demo content INSIDE the sandbox container
        if: ${{ inputs.mode == 'capture' }}
        # A sandboxed app cannot be handed an arbitrary folder without a human in
        # an NSOpenPanel, but it can read its own container freely. So the demo
        # tree and an rclone alias remote pointing at it both live there, which
        # needs no grant and no interaction.
        run: |
          set -euo pipefail
          C="$HOME/Library/Containers/com.gigaionllc.airclone/Data"
          mkdir -p "$C/Demo/Photos" "$C/Demo/Documents" "$C/Demo/Videos"
          # Fetch the same CC0 photographs the Play listing uses. Real media is not
          # optional: Google rejected a screenshot from this project as
          # "placeholder images or stock photos" when it showed gradient tiles.
          # Provenance: docs/store/play/DEMO-MEDIA-PROVENANCE.md
          i=0
          for U in             "Paxos_coastline_at_sunrise_DSC06029.jpg"             "Boat_Harbour_Beach_20190722-004.jpg"             "Mountain_and_Landscape.jpg"             "Garden_flowers,_Runita,_Moldova.jpg"             "Forest_trail,_Oberlibbach.jpg" ; do
            i=$((i+1))
            curl -fsSL -A "Airclone-CI/1.0"               "https://commons.wikimedia.org/wiki/Special:FilePath/$U?width=1600"               -o "$C/Demo/Photos/IMG_010$i.jpg" || echo "::warning::could not fetch $U"
          done
          ls -la "$C/Demo/Photos" || true
          # path_provider keys application-support by BUNDLE IDENTIFIER on macOS,
          # not by app name. The first attempt wrote to .../Application Support/
          # Airclone/ and the app never looked there, so the remote silently did
          # not exist. Write both, cheaply.
          for D in "Airclone" "com.gigaionllc.airclone"; do
            mkdir -p "$C/Library/Application Support/$D"
          done
          cat > "$C/Library/Application Support/Airclone/rclone.conf" <<'CONF'
          [Demo Cloud]
          type = alias
          remote = DEMO_PATH
          CONF
          sed -i '' "s|DEMO_PATH|$C/Demo|" \
            "$C/Library/Application Support/Airclone/rclone.conf"
          echo "--- seeded config ---"
          cat "$C/Library/Application Support/Airclone/rclone.conf"
          # THIS copy is the one that matters. path_provider keys its
          # application-support directory by BUNDLE IDENTIFIER on macOS, so the
          # app reads .../Application Support/com.gigaionllc.airclone/. An
          # earlier edit dropped this line and that directory stayed empty -
          # which is the whole reason the seeded remote never appeared. The
          # config was correct, complete, and in a directory nothing reads.
          cp "$C/Library/Application Support/Airclone/rclone.conf" \
             "$C/Library/Application Support/com.gigaionllc.airclone/rclone.conf"
          echo "--- configs present (the bundle-id one must be non-empty) ---"
          ls -la "$C/Library/Application Support/Airclone/rclone.conf" \
                 "$C/Library/Application Support/com.gigaionllc.airclone/rclone.conf"
          test -s "$C/Library/Application Support/com.gigaionllc.airclone/rclone.conf"

      - name: Find where the app really keeps its config
        if: ${{ inputs.mode == 'capture' }}
        # Two guesses at this path have now failed - .../Application Support/
        # Airclone/ and .../com.gigaionllc.airclone/. Rather than guess a third
        # time, run the app once and look.
        run: |
          set -uo pipefail
          APP="build/macos/Build/Products/Release/Airclone.app"
          open "$PWD/$APP"; sleep 25
          echo "--- is the seeded remote still in the config the app used? ---"
          CONF="$HOME/Library/Containers/com.gigaionllc.airclone/Data/Library/Application Support/Airclone/rclone.conf"
          if [ -f "$CONF" ]; then cat "$CONF"; else echo "CONFIG GONE - the app replaced or moved it"; fi
          echo "--- what does the engine itself think it loaded? ---"
          ls -la "$HOME/Library/Containers/com.gigaionllc.airclone/Data/Library/Application Support/" || true
          pkill -f "Airclone.app/Contents/MacOS/Airclone" || true
          sleep 3
          echo "--- containers ---"
          ls -la "$HOME/Library/Containers/" | grep -i airclone || echo "NO CONTAINER"
          echo "--- everything the app created ---"
          find "$HOME/Library/Containers" -ipath '*airclone*' -maxdepth 8             \( -name '*.conf' -o -name '*.plist' -o -type d -name 'Application Support' \) 2>/dev/null | head -30
          echo "--- any rclone.conf anywhere under HOME ---"
          find "$HOME" -name 'rclone.conf' -not -path '*/go/*' 2>/dev/null | head -10

      - name: Grant accessibility so the UI can be driven
        if: ${{ inputs.mode == 'capture' }}
        # SIP is DISABLED on these runners (confirmed by csrutil), so the TCC
        # database can be written directly. Without accessibility permission,
        # every osascript click and keystroke fails SILENTLY - which is what made
        # the earlier dismissal attempts look like they had run.
        #
        # This is a throwaway CI VM. Doing it anywhere else would be indefensible.
        run: |
          set -uo pipefail
          DB="/Library/Application Support/com.apple.TCC/TCC.db"
          for CLIENT in /usr/bin/osascript /bin/bash /usr/sbin/screencapture; do
            sudo sqlite3 "$DB" "INSERT OR REPLACE INTO access \
              (service,client,client_type,auth_value,auth_reason,auth_version,indirect_object_identifier,flags) \
              VALUES ('kTCCServiceAccessibility','$CLIENT',1,2,4,1,'UNUSED',0);" 2>&1 | head -2 || true
          done
          sudo killall tccd 2>/dev/null || true
          sleep 4
          echo "--- accessibility entries now ---"
          sudo sqlite3 "$DB" "SELECT service,client,auth_value FROM access WHERE service='kTCCServiceAccessibility';" || true
          echo "--- can osascript drive the UI? ---"
          osascript -e 'tell application "System Events" to return name of first process' && echo "ACCESSIBILITY OK" || echo "::warning::still blocked"

      - name: Capture at exact App Store dimensions
        if: ${{ inputs.mode == 'capture' }}
        # The runner offers 800x600 up to 1920x1080 and NONE of Apple's exact Mac
        # sizes (1280x800, 1440x900, 2560x1600, 2880x1800). That is fine: set the
        # display LARGER than the target, size the window to the target exactly,
        # and capture that region. `screencapture -R` writes exactly the pixels
        # asked for, so the output dimension is deterministic rather than a
        # rescale - Apple rejects off-by-one sizes and rescaling looks soft.
        env:
          SHOT_W: '1280'
          SHOT_H: '800'
          TOP: '140'    # (1080-800)/2 - centres the window vertically
          LEFT: '320'   # (1920-1280)/2 - and horizontally
          DQ: '"'
        run: |
          set -uo pipefail
          mkdir -p ../artifacts/shots
          SCREEN=$(displayplacer list | grep -m1 'Persistent screen id' | awk '{print $4}')
          displayplacer "id:${SCREEN} res:1920x1080 hz:60 color_depth:7 enabled:true scaling:off origin:(0,0) degree:0" ||             echo "::warning::could not change resolution - capture may be clipped"
          sleep 3
          echo "display now: $(displayplacer list | grep 'current mode')"

          APP="build/macos/Build/Products/Release/Airclone.app"
          open "$PWD/$APP"
          sleep 35   # engine start + first paint; a short wait captures a spinner

          osascript \
            -e 'tell application "System Events" to tell process "Airclone" to set frontmost to true' \
            -e "tell application \"System Events\" to tell process \"Airclone\" to set position of front window to {${LEFT}, ${TOP}}" \
            -e "tell application \"System Events\" to tell process \"Airclone\" to set size of front window to {${SHOT_W}, ${SHOT_H}}" \
            || echo "::warning::window geometry could not be set"
          sleep 4
          # NOT `screencapture -R`: on macOS 26 a region capture raises the
          # "bypass the system private window picker" consent dialog, which then
          # appears in the screenshot itself. Plain full-screen -x does not, so
          # capture the screen and crop to the window offline - identical pixels,
          # no prompt, no rescale.
          # macOS 26 raises a screen-recording consent prompt on the FIRST
          # screencapture of a session, and it renders fast enough to land in the
          # shot. My earlier theory - that `-R` specifically caused it - was
          # wrong; it happens with plain -x too. So: burn one capture to trigger
          # the prompt, dismiss it, and only then take the real one.
          # The consent prompt persists until dismissed, and osascript keystroke
          # does nothing here because synthetic events need accessibility
          # permission the runner has not granted. Try harder, and REPORT which
          # approach worked so the next run is not another guess.
          screencapture -x /tmp/warmup.png || true
          sleep 3
          # UserNotificationCenter owns the prompt and killing it clears it -
          # confirmed, this produced the first clean frame. osascript keystroke
          # does NOT work: synthetic events need accessibility permission the
          # runner has not granted, and it fails silently.
          sudo killall -9 UserNotificationCenter 2>/dev/null || true
          sleep 3
          # Flutter renders its own widgets, so System Events cannot address them
          # by name: `static text "Demo Cloud"` fails with -1728. Coordinates work,
          # and the geometry is deterministic because the window is pinned to a
          # known size and origin.
          shot() {  # $1 = output name
            sudo killall -9 UserNotificationCenter 2>/dev/null || true
            sleep 1
            screencapture -x "../artifacts/shots/$1.png"
            sips -c "${SHOT_H}" "${SHOT_W}" "../artifacts/shots/$1.png" > /dev/null
          }
          click() {  # $1,$2 = window-relative x,y
            # cliclick posts real CGEvents. System Events' `click at` returned no
            # error and had no effect - it is not a reliable way to deliver a
            # click into an application window.
            cliclick "c:$(( LEFT + $1 )),$(( TOP + $2 ))" || echo "::warning::click failed"
          }
          dclick() {  # double-click, for opening a folder row
            cliclick "dc:$(( LEFT + $1 )),$(( TOP + $2 ))" || echo "::warning::double-click failed"
          }

          shot 01-home

          # Coordinates are read off the previous run's frames. The toolbar
          # RE-LAYS OUT after navigation - the view toggles sit at x~778/810/842
          # once a remote is open, not at the home-view positions - so the
          # earlier grid/gallery clicks landed on the filter box instead.
          click 374 242         # Demo Cloud tile
          sleep 6
          shot 02-browse

          dclick 310 185        # open Photos
          sleep 7
          shot 03-photos

          click 842 98          # gallery view - the shot that needs real media
          sleep 8
          shot 04-gallery

          click 810 98          # grid view
          sleep 5
          shot 05-grid

          screencapture -x ../artifacts/shots/99-fullscreen.png
          # sips ships with macOS; pip3 does not work here (PEP 668 externally
          # managed environment on the Homebrew python). Its crop is CENTRED,
          # which is exactly right because the window is centred too: a 1280x800
          # centre crop of a 1920x1080 screen is precisely the window rectangle.
          cp ../artifacts/shots/99-fullscreen.png ../artifacts/shots/01-explorer.png
          sips -c "${SHOT_H}" "${SHOT_W}" ../artifacts/shots/01-explorer.png > /dev/null

          for f in ../artifacts/shots/*.png; do
            python3 -c "import struct,sys;d=open(sys.argv[1],'rb').read(33);w,h=struct.unpack('>II',d[16:24]);print(sys.argv[1],f'{w}x{h}','OK' if (w,h)==(${SHOT_W},${SHOT_H}) else 'NOT an App Store size')" "$f"
          done
          echo "--- is the seeded remote still in the config the app used? ---"
          CONF="$HOME/Library/Containers/com.gigaionllc.airclone/Data/Library/Application Support/Airclone/rclone.conf"
          if [ -f "$CONF" ]; then cat "$CONF"; else echo "CONFIG GONE - the app replaced or moved it"; fi
          echo "--- what does the engine itself think it loaded? ---"
          ls -la "$HOME/Library/Containers/com.gigaionllc.airclone/Data/Library/Application Support/" || true
          pkill -f "Airclone.app/Contents/MacOS/Airclone" || true

      - name: Collect any crash report
        if: ${{ always() && inputs.mode == 'capture' }}
        # The app died during this run. A crash in the SANDBOXED build is a
        # shipping blocker, not a screenshot inconvenience, so the report is
        # collected as a first-class artifact.
        run: |
          set -uo pipefail
          mkdir -p ../artifacts/crash
          for D in "$HOME/Library/Logs/DiagnosticReports" /Library/Logs/DiagnosticReports; do
            [ -d "$D" ] || continue
            find "$D" -iname "*irclone*" -exec cp {} ../artifacts/crash/ \; 2>/dev/null || true
          done
          ls -la ../artifacts/crash/ || true
          for f in ../artifacts/crash/*; do
            [ -f "$f" ] || continue
            echo "===== $f ====="
            head -60 "$f"
          done

      - uses: actions/upload-artifact@v6
        if: ${{ always() && inputs.mode == 'capture' }}
        with:
          name: mas-screenshots
          path: |
            artifacts/shots/*.png
            artifacts/crash/*
          if-no-files-found: warn
