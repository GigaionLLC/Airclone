name: App Store Connect (attach build + review notes)

# The two steps between "a build finished uploading" and "the version goes to
# review": attach the build to a version, and set the App Review notes from
# docs/store/apple/listing-en-US.md.
#
# Runs on ubuntu, not macOS - these are plain REST calls, and there is no reason
# to spend a Mac on them.
#
# This workflow does not submit - asc-submit-review.yml does, and it makes you
# name the exact version before it will. Export compliance needs no call from
# here either: it is answered declaratively by ITSAppUsesNonExemptEncryption in
# app/ios/Runner/Info.plist and app/macos/Runner/Info.plist, so Apple never asks
# per build. That answer holds only while France stays out of availability,
# which is why mode=audit carries a "french store" row - see the "Export
# compliance: SETTLED" section of dev/plans/apple-appstore-plan.md.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Which platform version to work on'
        required: true
        default: MAC_OS
        type: choice
        options: [MAC_OS, IOS]
      mode:
        description: 'report | apply = write it | audit = is it submittable? | builds = did the upload register? | create = make the version record'
        required: true
        default: report
        type: choice
        options: [report, apply, audit, builds, create]
      copyright:
        description: 'Set the copyright from the listing document'
        required: true
        default: false
        type: boolean
      manual_release:
        description: 'Set release type to MANUAL (approved version waits for a human)'
        required: true
        default: false
        type: boolean
      notes:
        description: 'Also set the App Review notes from the listing doc'
        required: true
        default: true
        type: boolean
      version:
        description: 'Version string (blank = the newest editable one)'
        required: false
        type: string
      build:
        description: 'Build number to attach (blank = newest VALID)'
        required: false
        type: string
      set_version:
        description: 'Rewrite the version string (e.g. 0.6.8). Blank = leave it.'
        required: false
        type: string
      attach:
        description: 'Attach a build (turn off for a platform with no build yet)'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - run: pip install --quiet cryptography

      - name: Refuse without credentials
        env:
          HAS_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY != '' }}
          ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
          KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
        run: |
          set -euo pipefail
          missing=""
          [ "$HAS_KEY" = "true" ] || missing="$missing APPSTORE_API_PRIVATE_KEY(secret)"
          [ -n "$ISSUER" ] || missing="$missing APPSTORE_ISSUER_ID(secret)"
          [ -n "$KEY_ID" ] || missing="$missing APPSTORE_API_KEY_ID(var)"
          if [ -n "$missing" ]; then
            echo "::error::missing:$missing"
            exit 1
          fi

      - name: Attach the build, and set the review notes
        env:
          P8: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
          # Apple requires a review contact on appStoreReviewDetails and rejects
          # the whole PATCH without one. It is personal data, so it lives in a
          # secret and is never written to this repo or printed.
          APPLE_REVIEW_CONTACT: ${{ secrets.APPLE_REVIEW_CONTACT }}
          # The three free-form inputs, passed as environment rather than
          # interpolated into the script below. Direct interpolation splices the
          # dispatch value into the shell verbatim, so a version string of
          # `0.7.5"; curl ... | sh; #` would run. Every other input on this
          # workflow is a choice or a boolean and cannot carry a payload.
          VERSION: ${{ inputs.version }}
          BUILD: ${{ inputs.build }}
          SET_VERSION: ${{ inputs.set_version }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$P8" > key.p8
          ARGS=""
          # Positional parameters carry the values that came from env, so they
          # stay one argument each however they are punctuated.
          set --
          # Quoting stops SHELL injection; it does not stop ARGUMENT injection.
          # tool/asc_build.py reads its options by `in ARGV` membership rather
          # than with a parser, so an input whose VALUE IS A FLAG becomes that
          # flag: mode=report with build='--apply' and set_version=
          # '--submit-for-review' would take a run that writes nothing all the
          # way to Add for Review. Refuse anything not shaped like what the
          # input is documented to hold.
          for pair in "version:$VERSION" "set_version:$SET_VERSION"; do
            name=${pair%%:*}; val=${pair#*:}
            case "$val" in
              ''|[0-9]*.[0-9]*) ;;
              *) echo "::error::$name must look like 1.2.3, got '$val'"; exit 1;;
            esac
          done
          case "$BUILD" in
            ''|*[!0-9]*) [ -z "$BUILD" ] || { echo "::error::build must be a number, got '$BUILD'"; exit 1; };;
          esac
          # `if`, not `[ ... ] && ARGS=...`: a false test makes the whole line
          # return 1, and this block runs under errexit (GitHub invokes every
          # `run:` as `bash -e {0}`), so the step would die on the first input
          # left blank. That trap has already cost this repo three CI runs.
          if [ "${{ inputs.mode }}" = "apply" ]; then ARGS="$ARGS --apply"; fi
          if [ "${{ inputs.mode }}" = "audit" ]; then ARGS="$ARGS --audit"; fi
          # builds: answers "did Apple actually register the build we uploaded?"
          # It needs no editable version, so it works in the window right after an
          # upload - which is the window where a build can die silently.
          if [ "${{ inputs.mode }}" = "builds" ]; then ARGS="$ARGS --builds"; fi
          # create: makes the appStoreVersion record itself, which every other
          # mode needs to exist before it can do anything. Takes the version
          # string from the `version` input, and writes only with --apply.
          if [ "${{ inputs.mode }}" = "create" ]; then
            if [ -z "$VERSION" ]; then
              echo "::error::mode=create needs the version input (e.g. 0.7.4)"; exit 1
            fi
            # NOTE: create is the one mode with no dry run. --apply is appended
            # here unconditionally, so dispatching it POSTs a real
            # appStoreVersion record. asc_build.py refuses when an editable
            # version already exists, which is the only guard.
            ARGS="$ARGS --apply"; set -- "$@" --create-version "$VERSION"
          fi
          if [ "${{ inputs.copyright }}" = "true" ]; then ARGS="$ARGS --copyright"; fi
          if [ "${{ inputs.manual_release }}" = "true" ]; then ARGS="$ARGS --manual-release"; fi
          if [ "${{ inputs.notes }}" = "true" ]; then ARGS="$ARGS --notes"; fi
          if [ "${{ inputs.attach }}" = "false" ]; then ARGS="$ARGS --no-attach"; fi
          if [ -n "$VERSION" ] && [ "${{ inputs.mode }}" != "create" ]; then
            set -- "$@" --version "$VERSION"
          fi
          if [ -n "$BUILD" ]; then set -- "$@" --build "$BUILD"; fi
          if [ -n "$SET_VERSION" ]; then set -- "$@" --set-version "$SET_VERSION"; fi
          # 6790176897 is the App Store Connect app id for Airclone. It is not a
          # secret - it is in every public App Store URL for the app.
          python tool/asc_build.py key.p8 "$KEY_ID" "$ISSUER" 6790176897 \
            --platform ${{ inputs.platform }} $ARGS "$@"

      - name: Shred the key
        if: always()
        run: rm -f key.p8
