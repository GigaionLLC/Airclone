name: iOS (simulator verify)

# Builds Airclone for the iOS SIMULATOR with librclone statically linked, then
# RUNS it and reads the engine banner off the screen.
#
# Why this exists: librclone-ios.yml proved the ARCHIVE builds. It did not prove
# the app LINKS against it or that dart:ffi can find the symbols at runtime -
# and rclone's own author's warning ("until it tries to link it with the wrong
# linker") was about exactly this step, not the archive. Three separate things
# can fail here and only one of them shows up as a build error:
#
#   1. the link  - Go does NOT apply its //go:cgo_ldflag directives for
#      c-archive, so CoreFoundation, Security and libresolv have to be named by
#      the Xcode target or the link ends in undefined symbols;
#   2. the strip - Release strips all symbols by default, which would delete the
#      Go exports and leave dlsym with nothing (hence STRIP_STYLE=non-global);
#   3. the runtime - DynamicLibrary.process() has to actually resolve
#      RcloneInitialize/RcloneRPC/RcloneFinalize/RcloneFreeString.
#
# Only running the thing distinguishes those, so this job runs it. It submits
# nothing and needs no Apple secret. See dev/plans/apple-appstore-plan.md C2.

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Which Flutter configuration to build'
        required: true
        default: 'debug'
        type: choice
        options: [debug, release]
      run_seconds:
        description: 'How long to let the app run before capturing'
        required: true
        default: '30'
        type: string
  push:
    paths:
      - 'app/lib/src/rclone/librclone_ffi.dart'
      - 'app/ios/**'
      - 'dev/ios/**'
      - '.github/workflows/ios-verify.yml'

permissions:
  contents: read

jobs:
  simulator-verify:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: 3.47.0, cache: true }
      - uses: actions/setup-go@v6
        # cache:false - the build script synthesizes its pinning module under
        # $HOME, so there is no committed go.sum for the default lookup to key on.
        with: { go-version: 'stable', cache: false }

      - name: Build librclone for iOS
        run: bash dev/ios/build-librclone-ios.sh

      - name: The archive must carry the symbols Dart will look up
        # Cheap, and it localises a later failure: if these are missing here the
        # problem is the Go build and nothing about Xcode is worth debugging.
        # Checked PER ARCHITECTURE, because a fat archive missing one slice is
        # exactly the failure that produced a green link and an empty binary.
        run: |
          set -euo pipefail
          A=app/ios/librclone/simulator/librclone.a
          test -f "$A"
          lipo -info "$A"
          for arch in arm64 x86_64; do
            echo "-- $arch --"
            for sym in RcloneInitialize RcloneFinalize RcloneRPC RcloneFreeString; do
              nm -arch "$arch" -g "$A" 2>/dev/null | grep -q " T _${sym}$" \
                || { echo "::error::_${sym} missing from the $arch simulator slice"; exit 1; }
              echo "  _${sym} exported"
            done
          done

      - name: Boot a simulator
        id: sim
        run: |
          set -euo pipefail
          # An arm64 host gives an arm64 simulator, which is the slice we built.
          # One line on purpose: a continuation starting at column 0 would end
          # the YAML block scalar and make the whole workflow unparseable.
          UDID="$(xcrun simctl list devices available -j | jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.isAvailable and (.name | test("iPhone")))] | sort_by(.name) | last | .udid')"
          test -n "$UDID" && test "$UDID" != null
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl list devices | grep "$UDID"

      - name: What the Runner target will actually link with
        # Answers "were the flags applied at all?" independently of anything the
        # build does. A conditional OTHER_LDFLAGS that never matched, or a
        # STRIP_STYLE that did not take, is invisible in a successful build.
        working-directory: app
        run: |
          set -uo pipefail
          flutter pub get > /dev/null
          xcodebuild -showBuildSettings -workspace ios/Runner.xcworkspace \
            -scheme Runner -configuration Debug -sdk iphonesimulator 2>/dev/null \
            | grep -E ' (OTHER_LDFLAGS|STRIP_STYLE|ARCHS|SRCROOT) =' | sed 's/^ */  /'

      - name: Build the app for the simulator
        working-directory: app
        env:
          CONFIG: ${{ inputs.configuration || 'debug' }}
        run: |
          set -euo pipefail
          flutter pub get
          # --simulator implies a non-signed build; --${CONFIG} picks the
          # configuration whose STRIP_STYLE we care about. release exercises the
          # strip path, debug is faster and is the default for a first look.
          mkdir -p ../artifacts
          # The full log is kept: "ld: warning: ignoring file ..., missing
          # required architecture" is the ONLY trace a partially-linked archive
          # leaves, and it scrolls past in a successful build.
          set +e
          flutter build ios --simulator "--${CONFIG}" -v > ../artifacts/ios-build.log 2>&1
          RC=$?
          set -e
          echo "--- linker complaints about the engine archive ---"
          grep -Ei 'librclone|force_load|ignoring file|missing required architecture' \
            ../artifacts/ios-build.log | head -30 || echo "  (none)"
          tail -40 ../artifacts/ios-build.log
          exit "$RC"

      - name: The linked binary must still export the Go symbols
        # Per ARCHITECTURE, and with `nm -g` alone - NOT `nm -gU`. On this
        # toolchain -U selects UNDEFINED symbols, so `-gU` asked for exactly the
        # opposite of what is wanted and reported all four missing on a binary
        # that had them. The archive check above always used bare -g, which is
        # why it agreed with reality and this one did not.
        working-directory: app
        run: |
          set -euo pipefail
          CONFIG="${{ inputs.configuration || 'debug' }}"
          DIR="build/ios/iphonesimulator/Runner.app"
          test -d "$DIR" || DIR="$(find build/ios -name 'Runner.app' -maxdepth 4 | head -1)"
          BIN="$DIR/Runner"
          echo "app bundle: $DIR"
          file "$BIN"
          MISSING=0
          for arch in $(lipo -archs "$BIN"); do
            echo "-- $arch --"
            for sym in RcloneInitialize RcloneFinalize RcloneRPC RcloneFreeString; do
              if nm -arch "$arch" -g "$BIN" 2>/dev/null | grep -q " T _${sym}$"; then
                echo "  _${sym} present"
              else
                echo "::error::_${sym} missing from the $arch slice ($CONFIG)"
                MISSING=1
              fi
            done
            if [ "$MISSING" = "1" ]; then
              # Carry the evidence with the failure rather than needing a rerun.
              echo "  -- every Rclone-ish symbol nm can see in this slice --"
              nm -arch "$arch" -g "$BIN" 2>/dev/null | grep -i rclone | head -20 \
                || echo "     (none at all - the archive really is not linked)"
            fi
          done
          echo "APP_DIR=$DIR" >> "$GITHUB_ENV"
          exit "$MISSING"


      - name: Install and run it
        env:
          UDID: ${{ steps.sim.outputs.udid }}
          RUN_SECONDS: ${{ inputs.run_seconds || '30' }}
        run: |
          set -uo pipefail
          mkdir -p artifacts
          xcrun simctl install "$UDID" "app/$APP_DIR"
          # The log stream starts BEFORE launch so it cannot miss a crash on the
          # very first frame, which is where a bad link would show up.
          xcrun simctl spawn "$UDID" log stream --style compact \
            --predicate 'process == "Runner"' > artifacts/ios-log.txt 2>&1 &
          LOG_PID=$!
          xcrun simctl launch "$UDID" com.gigaionllc.airclone || \
            echo "::warning::launch returned non-zero"
          sleep "$RUN_SECONDS"
          if xcrun simctl spawn "$UDID" launchctl list 2>/dev/null | grep -q gigaionllc.airclone; then
            echo "ALIVE=yes" >> "$GITHUB_ENV"
          else
            echo "ALIVE=no" >> "$GITHUB_ENV"
          fi
          xcrun simctl io "$UDID" screenshot artifacts/ios-screen.png || \
            echo "::warning::screenshot failed"
          kill "$LOG_PID" 2>/dev/null || true

      - name: Report
        # This step FAILS when the app is not running, deliberately. mas-verify
        # only warns, because there the sandbox denials were the to-do list and
        # the app staying up was a bonus. Here "it runs" IS the assertion, so a
        # job that went green over a process that died on the first frame would
        # be exactly the false pass AGENT.md rule 9 is about.
        run: |
          set -uo pipefail
          echo "--- anything that looks like a crash or an FFI failure ---"
          PAT='crash|fatal|LibrcloneFfi|dlopen|symbol not found|Unhandled'
          grep -Ei "$PAT" artifacts/ios-log.txt | head -40 || echo "  (nothing matched)"
          echo
          if [ "${ALIVE:-no}" = "yes" ]; then
            echo "the app is still running after the run window"
            echo "The screenshot is the finer verdict: the Home view shows the"
            echo "engine status, and librclone cannot report a version it did"
            echo "not start."
          else
            echo "::error::the app is NOT running - it never started or crashed."
            echo "Check ios-screen.png and ios-log.txt in the artifact."
            exit 1
          fi

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ios-simulator-verify
          path: |
            artifacts/ios-screen.png
            artifacts/ios-log.txt
            artifacts/ios-build.log
          if-no-files-found: warn
