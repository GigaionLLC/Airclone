name: Linux runner (compile)

# Compiles the Linux app, runner C++ included, whenever that C++ can change.
#
# WHY THIS EXISTS. ci.yml runs format, analyze and the Dart tests, and none of
# them compiles app/linux/runner/*.cc. `flutter build linux` ran ONLY in
# release.yml, on a tag. So v0.13.4 shipped a runner that called fl_engine_start
# - a PRIVATE flutter_linux symbol, absent from the public headers - and the
# first thing to notice was the release job, after the tag was public. The
# commit that introduced it had a green CI run, which is exactly how it got
# believed.
#
# Scoped to paths so ordinary Dart changes do not pay for a native build. It is
# the runner, the Linux CMake, and pubspec (which changes the plugin set, and
# therefore generated_plugin_registrant.cc) that can break this compile.
#
# It also packages the AppImage and tests its launcher, because the AppImage
# script's own fatal checks (libGLESv2 staged as a fallback and nowhere else)
# otherwise run only inside release.yml, after a tag is public. Nothing is
# uploaded: no rclone bundling, no release, no artifact.

on:
  push:
    branches: [main]
    paths:
      - 'app/linux/**'
      - 'dev/linux/**'
      - 'app/pubspec.yaml'
      - '.github/workflows/linux-runner.yml'
  pull_request:
    paths:
      - 'app/linux/**'
      - 'dev/linux/**'
      - 'app/pubspec.yaml'
      - '.github/workflows/linux-runner.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-runner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      # Same set release.yml installs; see its comments for why each is needed.
      - name: Install build deps
        working-directory: .
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev libmpv-dev mpv libsecret-1-dev desktop-file-utils
      # Pinned to the release pin. A floating channel here would test a
      # different embedder than the one that ships.
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: 3.47.0, cache: true }
      - uses: dtolnay/rust-toolchain@stable
      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - run: flutter build linux --release

      # The build compiling is necessary, not sufficient: the fix this job was
      # born from is `--version` answering WITHOUT GTK, and a runner that compiles
      # but still opens a display would pass the step above. xvfb is deliberately
      # NOT installed, so any attempt to reach a display fails here.
      - name: --version answers with no display
        run: |
          set -euo pipefail
          bin="build/linux/x64/release/bundle/airclone"
          out="$(env -u DISPLAY -u WAYLAND_DISPLAY "$bin" --version)"
          echo "got: $out"
          case "$out" in
            "Airclone "[0-9]*) ;;
            *) echo "::error::--version did not print a version: $out"; exit 1 ;;
          esac
      - name: --help answers with no display
        run: |
          set -euo pipefail
          bin="build/linux/x64/release/bundle/airclone"
          out="$(env -u DISPLAY -u WAYLAND_DISPLAY "$bin" --help)"
          for flag in --webui --webui-bind --webui-port --run-due --run-task --version --help; do
            grep -q -- "$flag" <<<"$out" || { echo "::error::--help does not mention $flag"; exit 1; }
          done

      # The launcher's library decisions, against simulated hosts. Runs on real
      # Linux, where /sbin/ldconfig exists - the script redirects the extracted
      # copy away from it, or every case would test this runner's own libraries.
      - name: AppRun chooses its fallbacks correctly
        working-directory: .
        run: bash dev/linux/test-apprun.sh

      # The Flatpak's host-side fusermount, against a fake flatpak-spawn: the
      # permission check comes first, fuse3 falls back to fuse2, and exactly the
      # right descriptors cross to the host. A wrong descriptor mounts the drive
      # on the host and leaves rclone waiting for /dev/fuse forever.
      - name: The Flatpak fusermount wrapper forwards what rclone needs
        working-directory: .
        run: bash dev/linux/test-fusermount-wrapper.sh

      # build-appimage.sh refuses to package without the bundled rclone engine,
      # and rightly: an AppImage without it downloads one on first run. The
      # release job bundles it in a step this workflow did not have, which is
      # exactly what failed the first run of this job.
      #
      # The version is READ from release.yml rather than repeated here.
      # rclone-bump.yml rewrites the pin in release.yml, so a second hardcoded
      # copy would drift silently the first time rclone is bumped. The variable
      # is `ver`, never RCLONE_VERSION: rclone maps that name to its own
      # --version flag and dies parsing it (see the release job's note).
      - name: Bundle rclone, as the release does (verified)
        run: |
          set -euo pipefail
          ver="$(grep -oP 'RCLONE_VERSION: \Kv[0-9.]+' ../.github/workflows/release.yml | head -1)"
          [ -n "$ver" ] || { echo "::error::could not read the rclone pin from release.yml"; exit 1; }
          zip="rclone-${ver}-linux-amd64.zip"
          base="https://downloads.rclone.org/${ver}"
          curl -fsSL --retry 3 -o "$zip" "$base/$zip"
          curl -fsSL --retry 3 -o SHA256SUMS.txt "$base/SHA256SUMS"
          expected="$(awk -v f="$zip" '{ n=$NF; sub(/^[*.\/]+/, "", n); if (n == f) { print $1; exit } }' SHA256SUMS.txt)"
          [ -n "$expected" ] || { echo "no checksum for $zip in SHA256SUMS"; exit 1; }
          actual="$(sha256sum "$zip" | awk '{print $1}')"
          [ "$actual" = "$expected" ] || { echo "rclone checksum mismatch (expected $expected, got $actual)"; exit 1; }
          unzip -q "$zip" -d rclone-extract
          install -Dm755 "rclone-extract/rclone-${ver}-linux-amd64/rclone" build/linux/x64/release/bundle/rclone
          echo "bundled rclone $ver"


      # THE CONTROL. The step above reported zero key events reaching Airclone,
      # with X input focus confirmed on its window, on both a 32-bit ARGB window
      # and a plain one. That is either a fault in this app or a fact about
      # Flutter on Linux under a bare X server - and the two want opposite fixes.
      #
      # So the same harness runs against a stock `flutter create` app whose only
      # job is to print the lines the harness reads. If the stock app logs keys
      # and Airclone does not, the fault is ours. If neither does, the harness is
      # typing into a Flutter window that cannot receive XTEST input here, and
      # the Airclone result above proves nothing about Airclone.
      - name: A stock Flutter app types, as a control
        # Diagnostic, not a gate: its job is to be COMPARED with the step below,
        # so a red control must not hide Airclone's own result.
        continue-on-error: true
        working-directory: .
        run: |
          set -euo pipefail
          rm -rf /tmp/keycontrol
          flutter create --platforms=linux --project-name keycontrol /tmp/keycontrol >/dev/null
          cp dev/linux/keycontrol_main.dart /tmp/keycontrol/lib/main.dart
          (cd /tmp/keycontrol && flutter build linux --release >/dev/null)
          bash dev/linux/test-keyboard.sh \
            /tmp/keycontrol/build/linux/x64/release/bundle/keycontrol keycontrol

      # --webui must SERVE without putting a window on screen. The runner still
      # builds one (realizing an FlView is the only public way to start an engine
      # on Linux), so "no window" is a claim about what gets MAPPED, and only a
      # real display can check it.
      #
      # THE BUG THIS PINS: through v0.13.6, `--webui` left an empty window titled
      # "airclone" on screen for as long as the server ran. Dart never calls
      # runApp on that path, but binding init still drew a warm-up frame, so
      # "first-frame" fired and the runner showed the toplevel - while --help
      # said "no window is shown".
      #
      # The plain launch below is not decoration: it proves the window check can
      # SEE a window. Without it, a build that failed to open one at all would
      # make the --webui half pass for the wrong reason.
      - name: --webui serves without showing a window
        run: |
          set -uo pipefail
          sudo apt-get install -y -qq xvfb xdotool x11-utils
          bin="$PWD/build/linux/x64/release/bundle/airclone"
          Xvfb :99 -screen 0 1280x720x24 >/dev/null 2>&1 &
          xvfb=$!
          export DISPLAY=:99
          for i in $(seq 1 30); do xdpyinfo >/dev/null 2>&1 && break; sleep 1; done
          cleanup() { kill "$xvfb" 2>/dev/null; }
          trap cleanup EXIT

          "$bin" --webui --webui-port 5799 >webui.log 2>&1 &
          app=$!
          served=
          for i in $(seq 1 90); do
            grep -q "Web UI listening" webui.log && { served=1; break; }
            kill -0 "$app" 2>/dev/null || break
            sleep 1
          done
          if [ -z "$served" ]; then
            echo "::error::--webui never started serving"; sed -n '1,60p' webui.log
            kill "$app" 2>/dev/null || true; exit 1
          fi
          # xdotool exits 1 when it finds nothing, and the step runs under bash -e,
          # so an unguarded assignment ends the step silently ON SUCCESS - which is
          # exactly what happened the first time this check passed.
          windows="$(xdotool search --onlyvisible --name airclone 2>/dev/null || true)"
          if [ -n "$windows" ]; then
            echo "what is on screen while --webui runs:"
            for w in $windows; do
              xwininfo -id "$w" -stats | sed -n '2,14p'
              xprop -id "$w" WM_CLASS WM_NAME _NET_WM_NAME 2>/dev/null
            done
            xwininfo -root -tree | sed -n '1,30p'
          fi
          # Under bash -e, wait returns 143 for a process we just SIGTERMed and
          # that ends the step - after the check has already passed.
          kill "$app" 2>/dev/null || true; wait "$app" 2>/dev/null || true
          if [ -n "$windows" ]; then
            echo "::error::--webui mapped a window: $windows"; exit 1
          fi
          echo "  --webui served with no window mapped"

          "$bin" >window.log 2>&1 &
          gui=$!
          seen=
          for i in $(seq 1 90); do
            [ -n "$(xdotool search --onlyvisible --name airclone 2>/dev/null)" ] && { seen=1; break; }
            kill -0 "$gui" 2>/dev/null || break
            sleep 1
          done
          kill "$gui" 2>/dev/null || true; wait "$gui" 2>/dev/null || true
          if [ -z "$seen" ]; then
            echo "::error::a plain launch mapped no window either - the check above proves nothing"
            sed -n '1,60p' window.log; exit 1
          fi
          echo "  a plain launch does map one, so the check can see windows"

      # Can a keystroke reach the app at all? A tester on WSL could click but not
      # type, in the AppImage and the Flatpak both, while xterm typed fine - so
      # the suspect is what the runner does to its own window rather than
      # anything either package bundles. dev/linux/test-keyboard.sh runs the real
      # binary on a virtual display with and without a compositing manager (which
      # is what makes the app ask for the ARGB visual), types, and checks the
      # screen moved more than it does when idle.
      - name: A keystroke reaches the app
        working-directory: .
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq xvfb xdotool x11-utils xcompmgr
          bash dev/linux/test-keyboard.sh app/build/linux/x64/release/bundle/airclone

      # Windowless still needs a display, because the engine starts only against
      # one. The message has to say that and name the way out, or the user meets
      # GTK's "cannot open display" with nothing to act on.
      - name: --webui without a display explains itself
        run: |
          set -uo pipefail
          bin="build/linux/x64/release/bundle/airclone"
          # A refusal is the expected outcome here, and the step runs under
          # bash -e: capture it with errexit off or the assignment ends the step
          # before the exit code can be read.
          set +e
          out="$(env -u DISPLAY -u WAYLAND_DISPLAY "$bin" --webui 2>&1)"
          code=$?
          set -e
          echo "$out"
          [ "$code" -eq 1 ] || { echo "::error::expected exit 1, got $code"; exit 1; }
          grep -qi "no display" <<<"$out" || { echo "::error::message does not say there is no display"; exit 1; }
          grep -q "xvfb-run" <<<"$out" || { echo "::error::message does not name a way to run it"; exit 1; }

      # Build the AppImage itself, which is where the fallback checks are FATAL:
      # libGLESv2 must be staged in usr/lib/fallback-gles and nowhere else. Until
      # now those checks ran only inside release.yml, after a tag was public.
      - name: Package the AppImage
        working-directory: .
        run: bash dev/linux/build-appimage.sh app/build/linux/x64/release/bundle "$RUNNER_TEMP/Airclone-x86_64.AppImage"

      - name: The packaged AppImage holds libGLESv2 as a fallback only
        working-directory: .
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          ./Airclone-x86_64.AppImage --appimage-extract >/dev/null
          test -s squashfs-root/usr/lib/fallback-gles/libGLESv2.so.2
          stray="$(find squashfs-root -name 'libGLESv2.so*' -not -path '*/fallback-gles/*')"
          if [ -n "$stray" ]; then
            echo "::error::libGLESv2 outside the fallback would shadow the host's: $stray"
            exit 1
          fi
          echo "libGLESv2 is in fallback-gles only"

  # Does mounting actually work on Linux, through the call Airclone makes?
  #
  # WHY THIS EXISTS. The mount dialog offers only "Auto (next free letter)" and
  # the drive letters D: to Z:, on every platform, and sends that value as
  # mountPoint. rclone documents "*" as WINDOWS-ONLY ("On Windows mountPoint may
  # be set to "*" to assign the next available drive letter"). On Linux it is a
  # literal path, and rclone's first step is to open it. Every mount point in the
  # app and its tests is a drive letter or "*", and no release records a Linux
  # mount working - yet the guide and README tell Flatpak users to use the
  # AppImage for mounting. That was inference from reading code, so this runs it.
  #
  # Kept as its own job: it needs only rclone and FUSE, not the Flutter build,
  # so it answers in a couple of minutes.
  mount-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install FUSE
        run: sudo apt-get update && sudo apt-get install -y fuse3
      - name: rclone, pinned from release.yml and verified
        run: |
          set -euo pipefail
          ver="$(grep -oP 'RCLONE_VERSION: \Kv[0-9.]+' .github/workflows/release.yml | head -1)"
          zip="rclone-${ver}-linux-amd64.zip"
          base="https://downloads.rclone.org/${ver}"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$zip" "$base/$zip"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/SHA256SUMS" "$base/SHA256SUMS"
          expected="$(awk -v f="$zip" '{ n=$NF; sub(/^[*.\/]+/, "", n); if (n == f) { print $1; exit } }' "$RUNNER_TEMP/SHA256SUMS")"
          [ "$(sha256sum "$RUNNER_TEMP/$zip" | awk '{print $1}')" = "$expected" ]
          unzip -q "$RUNNER_TEMP/$zip" -d "$RUNNER_TEMP/r"
          install -m755 "$RUNNER_TEMP/r/rclone-${ver}-linux-amd64/rclone" "$RUNNER_TEMP/rclone"
          env -u RCLONE_VERSION "$RUNNER_TEMP/rclone" version | head -1
      - name: Mount through the RC API, as the app does
        run: |
          set -uo pipefail
          R="$RUNNER_TEMP/rclone"
          "$R" rcd --rc-addr 127.0.0.1:5572 --rc-user probe --rc-pass probe >"$RUNNER_TEMP/rcd.log" 2>&1 &
          for i in $(seq 1 30); do curl -fsS -u probe:probe -X POST http://127.0.0.1:5572/core/version >/dev/null 2>&1 && break; sleep 0.5; done
          rc() { curl -sS -u probe:probe -H 'Content-Type: application/json' -X POST "http://127.0.0.1:5572/$1" -d "$2"; echo; }

          echo "=== 1. mountPoint '*' - exactly what the dialog's default Auto sends ==="
          rc mount/mount '{"fs":":memory:","mountPoint":"*"}' | tee "$RUNNER_TEMP/star.json"

          echo "=== 2. mountPoint 'D:' - a drive letter, the dialog's only other choice ==="
          rc mount/mount '{"fs":":memory:","mountPoint":"D:"}' | tee "$RUNNER_TEMP/letter.json"

          echo "=== 3. mountPoint = an empty directory - what Linux actually needs ==="
          mkdir -p "$RUNNER_TEMP/mnt"
          rc mount/mount "{\"fs\":\":memory:\",\"mountPoint\":\"$RUNNER_TEMP/mnt\"}" | tee "$RUNNER_TEMP/dir.json"
          sleep 2
          echo "--- kernel mount table ---"
          mount | grep -F "$RUNNER_TEMP/mnt" || echo "(not in the mount table)"
          echo "--- visible to an ordinary process? ---"
          echo hello > "$RUNNER_TEMP/mnt/probe.txt" && cat "$RUNNER_TEMP/mnt/probe.txt"

          echo "=== VERDICT ==="
          star_ok=no; letter_ok=no; dir_ok=no
          grep -q '"error"' "$RUNNER_TEMP/star.json" || star_ok=yes
          grep -q '"error"' "$RUNNER_TEMP/letter.json" || letter_ok=yes
          mount | grep -qF "$RUNNER_TEMP/mnt" && dir_ok=yes
          echo "'*' mounted:        $star_ok"
          echo "'D:' mounted:       $letter_ok"
          echo "directory mounted:  $dir_ok"
          rc mount/unmountall '{}' >/dev/null || true
          # The job PASSES only when a directory mount works. It does not assert
          # on '*' or 'D:': the point is to record what they do, and a future
          # rclone that learns '*' on Linux should not turn this red.
          [ "$dir_ok" = yes ]

