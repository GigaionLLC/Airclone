name: Linux runner (compile)

# Compiles the Linux app, runner C++ included, whenever that C++ can change.
#
# WHY THIS EXISTS. ci.yml runs format, analyze and the Dart tests, and none of
# them compiles app/linux/runner/*.cc. `flutter build linux` ran ONLY in
# release.yml, on a tag. So v0.13.4 shipped a runner that called fl_engine_start
# - a PRIVATE flutter_linux symbol, absent from the public headers - and the
# first thing to notice was the release job, after the tag was public. The
# commit that introduced it had a green CI run, which is exactly how it got
# believed.
#
# Scoped to paths so ordinary Dart changes do not pay for a native build. It is
# the runner, the Linux CMake, and pubspec (which changes the plugin set, and
# therefore generated_plugin_registrant.cc) that can break this compile.
#
# It also packages the AppImage and tests its launcher, because the AppImage
# script's own fatal checks (libGLESv2 staged as a fallback and nowhere else)
# otherwise run only inside release.yml, after a tag is public. Nothing is
# uploaded: no rclone bundling, no release, no artifact.

on:
  push:
    branches: [main]
    paths:
      - 'app/linux/**'
      - 'dev/linux/**'
      - 'app/pubspec.yaml'
      - '.github/workflows/linux-runner.yml'
  pull_request:
    paths:
      - 'app/linux/**'
      - 'dev/linux/**'
      - 'app/pubspec.yaml'
      - '.github/workflows/linux-runner.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-runner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      # Same set release.yml installs; see its comments for why each is needed.
      - name: Install build deps
        working-directory: .
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev libmpv-dev mpv libsecret-1-dev desktop-file-utils
      # Pinned to the release pin. A floating channel here would test a
      # different embedder than the one that ships.
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: 3.47.0, cache: true }
      - uses: dtolnay/rust-toolchain@stable
      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - run: flutter build linux --release

      # The build compiling is necessary, not sufficient: the fix this job was
      # born from is `--version` answering WITHOUT GTK, and a runner that compiles
      # but still opens a display would pass the step above. xvfb is deliberately
      # NOT installed, so any attempt to reach a display fails here.
      - name: --version answers with no display
        run: |
          set -euo pipefail
          bin="build/linux/x64/release/bundle/airclone"
          out="$(env -u DISPLAY -u WAYLAND_DISPLAY "$bin" --version)"
          echo "got: $out"
          case "$out" in
            "Airclone "[0-9]*) ;;
            *) echo "::error::--version did not print a version: $out"; exit 1 ;;
          esac
      - name: --help answers with no display
        run: |
          set -euo pipefail
          bin="build/linux/x64/release/bundle/airclone"
          out="$(env -u DISPLAY -u WAYLAND_DISPLAY "$bin" --help)"
          for flag in --webui --webui-bind --webui-port --run-due --run-task --version --help; do
            grep -q -- "$flag" <<<"$out" || { echo "::error::--help does not mention $flag"; exit 1; }
          done

      # The launcher's library decisions, against simulated hosts. Runs on real
      # Linux, where /sbin/ldconfig exists - the script redirects the extracted
      # copy away from it, or every case would test this runner's own libraries.
      - name: AppRun chooses its fallbacks correctly
        working-directory: .
        run: bash dev/linux/test-apprun.sh

      # build-appimage.sh refuses to package without the bundled rclone engine,
      # and rightly: an AppImage without it downloads one on first run. The
      # release job bundles it in a step this workflow did not have, which is
      # exactly what failed the first run of this job.
      #
      # The version is READ from release.yml rather than repeated here.
      # rclone-bump.yml rewrites the pin in release.yml, so a second hardcoded
      # copy would drift silently the first time rclone is bumped. The variable
      # is `ver`, never RCLONE_VERSION: rclone maps that name to its own
      # --version flag and dies parsing it (see the release job's note).
      - name: Bundle rclone, as the release does (verified)
        run: |
          set -euo pipefail
          ver="$(grep -oP 'RCLONE_VERSION: \Kv[0-9.]+' ../.github/workflows/release.yml | head -1)"
          [ -n "$ver" ] || { echo "::error::could not read the rclone pin from release.yml"; exit 1; }
          zip="rclone-${ver}-linux-amd64.zip"
          base="https://downloads.rclone.org/${ver}"
          curl -fsSL --retry 3 -o "$zip" "$base/$zip"
          curl -fsSL --retry 3 -o SHA256SUMS.txt "$base/SHA256SUMS"
          expected="$(awk -v f="$zip" '{ n=$NF; sub(/^[*.\/]+/, "", n); if (n == f) { print $1; exit } }' SHA256SUMS.txt)"
          [ -n "$expected" ] || { echo "no checksum for $zip in SHA256SUMS"; exit 1; }
          actual="$(sha256sum "$zip" | awk '{print $1}')"
          [ "$actual" = "$expected" ] || { echo "rclone checksum mismatch (expected $expected, got $actual)"; exit 1; }
          unzip -q "$zip" -d rclone-extract
          install -Dm755 "rclone-extract/rclone-${ver}-linux-amd64/rclone" build/linux/x64/release/bundle/rclone
          echo "bundled rclone $ver"

      # Build the AppImage itself, which is where the fallback checks are FATAL:
      # libGLESv2 must be staged in usr/lib/fallback-gles and nowhere else. Until
      # now those checks ran only inside release.yml, after a tag was public.
      - name: Package the AppImage
        working-directory: .
        run: bash dev/linux/build-appimage.sh app/build/linux/x64/release/bundle "$RUNNER_TEMP/Airclone-x86_64.AppImage"

      - name: The packaged AppImage holds libGLESv2 as a fallback only
        working-directory: .
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          ./Airclone-x86_64.AppImage --appimage-extract >/dev/null
          test -s squashfs-root/usr/lib/fallback-gles/libGLESv2.so.2
          stray="$(find squashfs-root -name 'libGLESv2.so*' -not -path '*/fallback-gles/*')"
          if [ -n "$stray" ]; then
            echo "::error::libGLESv2 outside the fallback would shadow the host's: $stray"
            exit 1
          fi
          echo "libGLESv2 is in fallback-gles only"
