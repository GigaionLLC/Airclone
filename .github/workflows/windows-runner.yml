name: Windows runner (app on a real engine)

# Runs the REAL app on a real Windows desktop, against a real rclone, and checks
# the chain that unit tests are built to avoid: engine start, typed rc calls,
# app state, rendered widgets.
#
# WHY THIS EXISTS. Every other test of the app answers `rpc` with a fake - that
# is what makes 1686 of them run in a minute, and it is also what they cannot
# tell you. After the engine layer moved out into `packages/airclone_rc`, the
# question "do the app, the package and a real rclone still fit together?" stopped
# having an answer anywhere in CI. `package-airclone-rc` proves the package drives
# rclone; `analyze-test` proves the app's logic; neither one starts the app.
#
# It is scoped to paths, because it is a full Windows build of the app. Nothing
# is signed, packaged or uploaded here: distribution lives in release.yml.

on:
  push:
    branches: [main]
    paths:
      - 'app/lib/**'
      - 'app/integration_test/**'
      - 'app/pubspec.yaml'
      - 'packages/airclone_rc/**'
      - '.github/workflows/windows-runner.yml'
  pull_request:
    paths:
      - 'app/lib/**'
      - 'app/integration_test/**'
      - 'app/pubspec.yaml'
      - 'packages/airclone_rc/**'
      - '.github/workflows/windows-runner.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-runner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      # Pinned to the release pin. A floating channel would run a different
      # embedder than the one that ships.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2.23.0
        with: { channel: stable, flutter-version: 3.47.0, cache: true }
      # super_native_extensions (drag-out) builds a Rust crate via cargokit.
      # The toolchain is stated rather than left to the action's default: a SHA
      # does not tell a reader which one it installs, and both master and the v1
      # tag declare this input required with no default - so the day this pin
      # moves, an unset input fails at the parse step.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # stable branch
        with: { toolchain: stable }
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get

      # The app finds its engine in this order: an explicit override, the
      # managed copy in app-support, one beside the executable, then PATH
      # (`where rclone`). A runner has none of the first three, so PATH is the
      # one to fill. The pin is read out of release.yml because rclone-bump.yml
      # rewrites it there - a second copy here would drift on the first bump.
      - name: Put the pinned rclone on PATH (verified)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $m = Select-String -Path '../.github/workflows/release.yml' -Pattern 'RCLONE_VERSION:\s*(v[0-9.]+)' | Select-Object -First 1
          if (-not $m) { throw 'could not read the rclone pin from release.yml' }
          $ver = $m.Matches[0].Groups[1].Value
          $triple = 'windows-amd64'
          $zip = "rclone-$ver-$triple.zip"
          $base = "https://downloads.rclone.org/$ver"
          Invoke-WebRequest "$base/$zip" -OutFile $zip -MaximumRetryCount 3 -RetryIntervalSec 5
          Invoke-WebRequest "$base/SHA256SUMS" -OutFile SHA256SUMS.txt -MaximumRetryCount 3 -RetryIntervalSec 5
          $expected = $null
          foreach ($l in (Get-Content SHA256SUMS.txt)) {
            $parts = $l -split '\s+'
            if ($parts.Count -ge 2 -and ($parts[-1].TrimStart('*', '.', '/')) -eq $zip) { $expected = $parts[0].ToUpper(); break }
          }
          if (-not $expected) { throw "no checksum for $zip in SHA256SUMS" }
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToUpper()
          if ($actual -ne $expected) { throw "rclone checksum mismatch (expected $expected, got $actual)" }
          Expand-Archive $zip -DestinationPath rclone-extract -Force
          $dir = (Resolve-Path "rclone-extract/rclone-$ver-$triple").Path
          Add-Content -Path $env:GITHUB_PATH -Value $dir
          Write-Output "rclone $ver on PATH at $dir"

      - name: rclone answers before the app asks it to
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $found = (Get-Command rclone -ErrorAction SilentlyContinue)
          if (-not $found) { throw 'rclone is not on PATH - the app would find no engine and the test would fail with a confusing message' }
          rclone version | Select-Object -First 1

      # The test itself builds the app for the windows device and runs it.
      - name: The app, the package and a real rclone, together
        run: flutter test integration_test/typed_engine_smoke_test.dart -d windows
