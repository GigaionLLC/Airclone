name: Publish airclone_rc to pub.dev

# Publishes packages/airclone_rc when a tag shaped `airclone_rc-vX.Y.Z` is
# pushed. That pattern is deliberately NOT `v*`: release.yml owns `v*` and
# builds the app, and the package's version is independent of the app's.
#
# PUBLISHING IS EFFECTIVELY PERMANENT. A pub.dev version can be retracted but
# never deleted or replaced, so the tag is the point of no return, not this
# file. Everything below is arranged so the irreversible step happens last and
# only after the reversible ones have passed.
#
# Two things must be true before it can work, and BOTH are the maintainer's to
# do once, by hand (see dev/plans/airclone-rc-package-plan.md, Milestone C):
#
#   1. pub.dev must be told to trust this repository. On the package's admin
#      page, enable automated publishing from GitHub Actions for
#      GigaionLLC/Airclone with the tag pattern `airclone_rc-v{{version}}`.
#      That is what makes the OIDC token below acceptable to pub.dev; there is
#      no credential to store here, which is the point.
#   2. `publish_to: none` must come out of the package's pubspec. It is there
#      on purpose until then - it is the thing that makes an accidental publish
#      impossible - so this workflow checks for it and stops with an
#      explanation rather than failing somewhere less obvious.

on:
  push:
    tags: ['airclone_rc-v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate only - never publishes, safe to run any time'
        type: boolean
        default: true

permissions:
  id-token: write   # the OIDC token pub.dev verifies; there is no API key here
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/airclone_rc
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d  # v1.8.1

      - name: Install dependencies
        run: dart pub get

      # The gates the package is held to on every PR, repeated here because a
      # publish is the one action that cannot be taken back by fixing it.
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: dart analyze --fatal-infos
      - name: Unit tests
        run: dart test
      - name: Documentation builds without a warning
        # A dangling reference is invisible in review and permanent on pub.dev.
        run: |
          set -euo pipefail
          out="$(dart doc --output "$(mktemp -d)" 2>&1)"
          echo "$out"
          echo "$out" | grep -q "Found 0 warnings" || {
            echo "::error::dartdoc reported warnings; they would ship to pub.dev"; exit 1; }

      - name: The tag and the pubspec must agree
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/airclone_rc-v}"
          have="$(grep -oP '^version:\s*\K\S+' pubspec.yaml)"
          [ "$tag" = "$have" ] || {
            echo "::error::tag says $tag, pubspec says $have"; exit 1; }
          echo "publishing airclone_rc $have"

      - name: Say plainly if the package is still marked unpublishable
        # Tag runs only. A manual dispatch is a validation run, and refusing to
        # validate because the guard is still in place would make the workflow
        # unprovable until the moment it matters most.
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          if grep -q '^publish_to:\s*none' pubspec.yaml; then
            echo "::error::pubspec.yaml still carries \`publish_to: none\`, which is the guard that keeps this package off pub.dev. Remove it in the same commit that bumps the version you intend to publish - and do the pub.dev side first (admin page → automated publishing → GigaionLLC/Airclone, tag pattern airclone_rc-v{{version}})."
            exit 1
          fi

      - name: Dry run
        run: dart pub publish --dry-run

      # LAST, and only for a tag. A manual dispatch validates and stops, so
      # this workflow can be exercised without consequence.
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        run: dart pub publish --force
