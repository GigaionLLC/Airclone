name: Play Store listing images

# Uploads listing graphics — including the Android TV set — from the repo to
# Google Play, with no Console login and no file picker.
#
# This exists because the Console's "Add assets" button opens a NATIVE file
# dialog, which nothing but a human at that machine can drive. The images are
# already in the repo and the API takes them directly, so the manual step was
# only ever a habit.
#
#   docs/store/play/tv/     Android TV  (tvScreenshots)
#   docs/store/play/phone/  phone       (phoneScreenshots)
#
# It writes IMAGES ONLY. It cannot change text, cannot attach a build, cannot
# opt in to a form factor, and cannot publish — Play still holds the change as
# a draft until someone reviews and sends it.

on:
  workflow_dispatch:
    inputs:
      type:
        description: 'Which image set to write'
        required: true
        default: tvScreenshots
        type: choice
        options:
          - tvScreenshots
          - tvBanner
          - phoneScreenshots
          - sevenInchScreenshots
          - tenInchScreenshots
          - featureGraphic
          - icon
      dir:
        description: 'Folder of images, relative to the repo root'
        required: true
        default: docs/store/play/tv
        type: string
      replace:
        description: 'Clear the set first (Play APPENDS otherwise, leaving duplicates)'
        required: true
        default: true
        type: boolean
      mode:
        description: 'report = show what it would send | apply = send it'
        required: true
        default: report
        type: choice
        options: [report, apply]

permissions:
  contents: read

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install --quiet google-auth requests

      - name: Refuse without credentials
        env:
          HAS_PLAY_CREDS: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
        run: |
          if [ "$HAS_PLAY_CREDS" != "true" ]; then
            echo "::error::PLAY_SERVICE_ACCOUNT_JSON is not set — see dev/play-ci-setup.md."
            exit 1
          fi

      - name: Write the service-account key
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          # $RUNNER_TEMP is outside the workspace, so it can never be picked up
          # by a later step that archives or uploads the checkout.
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/play-key.json"

      - name: Upload
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/play-key.json
        run: |
          set -euo pipefail
          # `if`, not `[ ... ] && ARGS=...`: a false test returns 1, and every
          # `run:` block is invoked as `bash -e {0}`, so the step would fail.
          args=(--package com.gigaionllc.airclone
                --type '${{ inputs.type }}'
                --dir '${{ inputs.dir }}')
          if [ '${{ inputs.replace }}' = 'true' ]; then args+=(--replace); fi
          if [ '${{ inputs.mode }}' = 'apply' ]; then args+=(--apply); fi
          python tool/play_images.py "${args[@]}"

      - name: Shred the key
        if: always()
        run: rm -f "$RUNNER_TEMP/play-key.json"
