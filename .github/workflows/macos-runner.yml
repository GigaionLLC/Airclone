name: macOS runner (window behaviour)

# Builds the direct-download macOS app on a real Mac and checks that the flags
# meant for an unattended machine put NOTHING on screen.
#
# WHY THIS EXISTS. `--webui` serves the interface to browsers instead of opening
# a window - that is the whole point of it. On macOS the window comes from the
# nib and AppKit shows it whatever the Dart entrypoint decides, so the app sat
# there with an empty window and a Dock icon for as long as the server ran.
# Linux had the same bug from a different cause, and the only reason it was
# caught is that CI looked (linux-runner.yml).
#
# Nobody on this project owns a Mac, so "it probably works" is not available;
# a macos-latest runner is a real Mac and can answer this.
#
# Scoped to paths, because it is a full macOS build. Nothing is signed, uploaded
# or submitted here: distribution lives in release.yml.

on:
  push:
    branches: [main]
    paths:
      - 'app/macos/**'
      - 'app/lib/main.dart'
      - 'app/lib/src/headless/**'
      - 'app/lib/src/webui/**'
      - 'dev/macos/**'
      - '.github/workflows/macos-runner.yml'
  pull_request:
    paths:
      - 'app/macos/**'
      - 'app/lib/main.dart'
      - 'app/lib/src/headless/**'
      - 'app/lib/src/webui/**'
      - 'dev/macos/**'
      - '.github/workflows/macos-runner.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-runner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  window-behaviour:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      # Pinned to the release pin. A floating channel would test a different
      # embedder than the one that ships.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2.23.0
        with: { channel: stable, flutter-version: 3.47.0, cache: true }
      # super_native_extensions (drag-out) builds a Rust crate via cargokit.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # stable branch
        with: { toolchain: stable }
      - run: flutter config --enable-macos-desktop
      - run: flutter pub get
        working-directory: app
      - run: flutter build macos --release
        working-directory: app

      # The Web UI needs an engine, and a CI build has none: the release bundles
      # librclone.dylib (built by a separate job) rather than a binary, and this
      # job builds neither. The app falls back to a bundled binary beside its own
      # executable, so put a verified one there - the same shape the Linux runner
      # uses, and the reason that job's --webui check works at all.
      - name: Bundle a verified rclone, so the Web UI has an engine
        working-directory: app
        run: |
          set -euo pipefail
          ver="$(grep -oE 'RCLONE_VERSION: v[0-9.]+' ../.github/workflows/release.yml | head -1 | awk '{print $2}')"
          [ -n "$ver" ] || { echo "::error::could not read the rclone pin"; exit 1; }
          zip="rclone-${ver}-osx-arm64.zip"
          base="https://downloads.rclone.org/${ver}"
          curl -fsSL --retry 3 -o "$zip" "$base/$zip"
          curl -fsSL --retry 3 -o SHA256SUMS.txt "$base/SHA256SUMS"
          expected="$(awk -v f="$zip" '{ n=$NF; sub(/^[*.\/]+/, "", n); if (n == f) { print $1; exit } }' SHA256SUMS.txt)"
          [ -n "$expected" ] || { echo "::error::no checksum for $zip"; exit 1; }
          actual="$(shasum -a 256 "$zip" | awk '{print $1}')"
          [ "$actual" = "$expected" ] || { echo "::error::rclone checksum mismatch"; exit 1; }
          unzip -q "$zip" -d rclone-extract
          app="build/macos/Build/Products/Release/Airclone.app"
          cp "rclone-extract/rclone-${ver}-osx-arm64/rclone" "$app/Contents/MacOS/rclone"
          chmod +x "$app/Contents/MacOS/rclone"
          echo "bundled rclone $ver"

      - name: --version answers, and quietly
        working-directory: app
        run: |
          set -uo pipefail
          app="build/macos/Build/Products/Release/Airclone.app"
          out="$("$app/Contents/MacOS/Airclone" --version 2>&1)"
          code=$?
          echo "got: $out"
          [ "$code" -eq 0 ] || { echo "::error::--version exited $code"; exit 1; }
          case "$out" in
            *[0-9].[0-9]*) ;;
            *) echo "::error::--version did not print a version"; exit 1 ;;
          esac

      # The real check: serving must not mean showing. See the script for how it
      # counts windows and why a plain launch has to show one.
      - name: --webui serves without a window
        run: bash dev/macos/test-webui-window.sh app/build/macos/Build/Products/Release/Airclone.app
