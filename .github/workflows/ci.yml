name: CI

# Fast feedback on every push/PR: format check, static analysis, and unit tests.
# These run on ubuntu (and locally via `docker compose run --rm flutter ...`) and do
# NOT require the Windows/macOS toolchains.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly canary: catches upstream drift (new rclone releases via the
    # rclone-pin job below, plus Flutter/pub breakage in analyze-test) even
    # when the repo itself is quiet.
    - cron: '0 6 * * 1'

defaults:
  run:
    working-directory: app


# Every other workflow in this repo pins this; ci.yml did not, so its token
# inherited the repo/org default - read-write unless someone changed it. It
# runs on pull_request, which is the one trigger where that matters most.
permissions:
  contents: read
jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2.23.0
        with:
          # PINNED, not floating "stable" — see the note in release.yml.
          channel: stable
          flutter-version: 3.47.0
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: flutter analyze
      - name: Unit tests
        run: flutter test --coverage
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: app/coverage/lcov.info
          if-no-files-found: ignore

  # The airclone_rc package is NOT covered by the job above: `defaults.run`
  # points at app/, so its format, lint and test gates would simply never run
  # on the package's code. Nothing would fail; the code would just be
  # ungoverned.
  package-airclone-rc:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/airclone_rc
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2.23.0
        with:
          # Pure Dart package, but the pinned Flutter SDK carries the Dart SDK
          # the app is built with, so both sides are analyzed by one toolchain.
          channel: stable
          flutter-version: 3.47.0
          cache: true
      - name: Install dependencies
        run: dart pub get
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        # --fatal-infos matches `flutter analyze`, which fails on any info-level
        # lint; without it the two sides are held to different standards.
        run: dart analyze --fatal-infos
      - name: Unit tests
        run: dart test
      - name: Spawned engine, against a real rclone
        # `dart test` above SKIPS rcd_integration_test.dart unless
        # AIRCLONE_RCLONE points at a binary, which would leave the HTTP engine
        # — the half Airclone runs on every desktop — proven only against
        # fakes. librclone.yml covers the FFI half the same way, with a lib it
        # builds. The pin is read out of release.yml because rclone-bump.yml
        # rewrites it there, so a second copy here would drift on the first
        # bump; and the variable is `ver`, never RCLONE_VERSION, which rclone
        # maps to its own --version flag and dies parsing it.
        run: |
          set -euo pipefail
          ver="$(grep -oP 'RCLONE_VERSION: \Kv[0-9.]+' ../../.github/workflows/release.yml | head -1)"
          [ -n "$ver" ] || { echo "::error::could not read the rclone pin from release.yml"; exit 1; }
          work="$(mktemp -d)"
          zip="rclone-${ver}-linux-amd64.zip"
          base="https://downloads.rclone.org/${ver}"
          curl -fsSL --retry 3 -o "$work/$zip" "$base/$zip"
          curl -fsSL --retry 3 -o "$work/SHA256SUMS.txt" "$base/SHA256SUMS"
          expected="$(awk -v f="$zip" '{ n=$NF; sub(/^[*.\/]+/, "", n); if (n == f) { print $1; exit } }' "$work/SHA256SUMS.txt")"
          [ -n "$expected" ] || { echo "::error::no checksum for $zip in SHA256SUMS"; exit 1; }
          actual="$(sha256sum "$work/$zip" | awk '{print $1}')"
          [ "$actual" = "$expected" ] || { echo "::error::rclone checksum mismatch (expected $expected, got $actual)"; exit 1; }
          unzip -q "$work/$zip" -d "$work/extract"
          bin="$work/extract/rclone-${ver}-linux-amd64/rclone"
          chmod +x "$bin"
          echo "testing against $("$bin" version | head -1)"
          AIRCLONE_RCLONE="$bin" dart test test/rcd_integration_test.dart
      - name: The package never imports the app
        # The whole point of the split. The trailing slash is load-bearing:
        # without it this also matches the package's own package:airclone_rc
        # imports and fails every time.
        run: |
          if grep -rn "package:airclone/" lib; then
            echo "::error::airclone_rc must not import the app"; exit 1
          fi

  # TEMPORARY, removed in the commit right after this one. A new workflow
  # cannot be dispatched until it is on the default branch, and a publishing
  # workflow nobody has ever run is the worst possible thing to discover is
  # broken. This copy proves its steps on a runner; its publish step is
  # hard-disabled rather than merely ref-guarded.
  publish-dry-run-TEMP:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/airclone_rc
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d  # v1.8.1

      - name: Install dependencies
        run: dart pub get

      # The gates the package is held to on every PR, repeated here because a
      # publish is the one action that cannot be taken back by fixing it.
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: dart analyze --fatal-infos
      - name: Unit tests
        run: dart test
      - name: Documentation builds without a warning
        # A dangling reference is invisible in review and permanent on pub.dev.
        run: |
          set -euo pipefail
          out="$(dart doc --output "$(mktemp -d)" 2>&1)"
          echo "$out"
          echo "$out" | grep -q "Found 0 warnings" || {
            echo "::error::dartdoc reported warnings; they would ship to pub.dev"; exit 1; }

      - name: The tag and the pubspec must agree
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/airclone_rc-v}"
          have="$(grep -oP '^version:\s*\K\S+' pubspec.yaml)"
          [ "$tag" = "$have" ] || {
            echo "::error::tag says $tag, pubspec says $have"; exit 1; }
          echo "publishing airclone_rc $have"

      - name: Say plainly if the package is still marked unpublishable
        # Tag runs only. A manual dispatch is a validation run, and refusing to
        # validate because the guard is still in place would make the workflow
        # unprovable until the moment it matters most.
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          if grep -q '^publish_to:\s*none' pubspec.yaml; then
            echo "::error::pubspec.yaml still carries \`publish_to: none\`, which is the guard that keeps this package off pub.dev. Remove it in the same commit that bumps the version you intend to publish - and do the pub.dev side first (admin page → automated publishing → GigaionLLC/Airclone, tag pattern airclone_rc-v{{version}})."
            exit 1
          fi

      - name: Dry run
        run: dart pub publish --dry-run

      # LAST, and only for a tag. A manual dispatch validates and stops, so
      # this workflow can be exercised without consequence.
      - name: Publish
        if: false  # TEMP copy: never, whatever the ref says
        run: dart pub publish --force

  docs:
    # Two cheap guards that had no CI at all, on a runner with no Flutter.
    #
    # check-docs.py's own docstring said it was "safe to wire into CI later", and
    # later never came: its only callers were checklist items nobody runs on a
    # push. It exits 1 on a BROKEN LINK, which is the right hard gate - a link to
    # a moved file is wrong for everyone downstream. --strict is deliberately
    # off, so orphans and shape findings stay advisory rather than failing a
    # release on a doc nothing happens to link yet.
    #
    # compileall covers the store scripts, which have no tests and whose FIRST
    # execution is against a live store API, half way through a release. It only
    # catches the parse-time class - a stray edit that leaves a script
    # unparseable - but that is exactly the class nothing else here catches, and
    # the cost of missing it is not a red check. store_submit.py has already died
    # mid-run once - a character outside cp1252 on a Windows runner - and left a
    # half-created Store submission behind. A script that will not even parse
    # fails in exactly that shape, and this catches it before the release does.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }
      - name: Check the doc library
        working-directory: .
        run: python tool/check-docs.py
      - name: Byte-compile the store scripts
        working-directory: .
        run: python -m compileall -q tool/
      - name: Test the CLA check
        working-directory: .
        # tool/cla_check.py decides whether an outside pull request may merge,
        # from a pull_request_target run with a write token. Its worst failure
        # is silent - an unsigned author goes green - so it has tests, and they
        # run here rather than on the live check.
        run: python tool/test_cla_check.py
      - name: Check the workflow files
        working-directory: .
        # GitHub's parser is the only authority on a workflow file and it has no
        # local equivalent - `yaml.safe_load` passes files GitHub rejects. An
        # invalid one cannot be dispatched at all, and it announces itself only
        # as a failed push run named after the file path, with no logs. Both
        # checks are for defects this repo has actually shipped, one of them
        # three times in a day. See tool/check-workflows.py.
        run: |
          pip install --quiet pyyaml
          python tool/check-workflows.py

  rclone-pin:
    # Warns (never fails) when the Android rclone pin drifts between its two
    # definition sites, or falls behind the latest upstream release — rclone
    # patch releases regularly carry security fixes (v1.74.4: serve s3/webdav
    # CVEs), so a stale pin should be loud.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check rclone pin freshness
        working-directory: .
        run: |
          set -euo pipefail
          yml=$(grep -oP 'RCLONE_VERSION: \Kv[0-9.]+' .github/workflows/release.yml | head -1)
          ps1=$(grep -oP "RcloneVersion = '\Kv[0-9.]+" dev/android/build-rclone.ps1 | head -1)
          # Desktop in-process engine pins (dual-engine): must match the Android pin.
          dps=$(grep -oP "RcloneVersion = '\Kv[0-9.]+" dev/desktop/build-librclone.ps1 | head -1)
          dsh=$(grep -oP 'RCLONE_VERSION="\Kv[0-9.]+' dev/desktop/build-librclone.sh | head -1)
          latest=$(curl -fsS https://downloads.rclone.org/version.txt | grep -oP 'v[0-9.]+' | head -1 || echo unknown)
          echo "release.yml: $yml | android ps1: $ps1 | desktop ps1: $dps | desktop sh: $dsh | upstream: $latest"
          for name in "android build-rclone.ps1:$ps1" "desktop build-librclone.ps1:$dps" "desktop build-librclone.sh:$dsh"; do
            site=${name%%:*}; ver=${name##*:}
            if [ "$yml" != "$ver" ]; then
              echo "::warning::rclone pin drift: release.yml has $yml but $site has $ver — keep them in sync."
            fi
          done
          if [ "$latest" != "unknown" ] && [ "$yml" != "$latest" ]; then
            echo "::warning::rclone pin $yml is behind the latest upstream release $latest — check the changelog (security fixes ship in patch releases) and bump every pin site."
          fi
