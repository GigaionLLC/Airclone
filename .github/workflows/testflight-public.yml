name: TestFlight public beta (iOS)

# The free way to try the iPhone/iPad app: an external TestFlight group with a
# public link. iOS cannot sideload and the App Store build is paid; macOS is not
# here because it is a free download from GitHub Releases.
#
# Sets up (once) and maintains: the group "Public beta", its public link and
# tester cap, the beta information Apple requires, and the newest iOS build
# added to the group and submitted to Beta App Review. Reruns write only what
# is missing or different, so this is also how a new build reaches testers and
# how the cap is raised (rerun with a bigger tester_limit).
#
# The tester feedback email is the App Review contact's email
# (APPLE_REVIEW_CONTACT), by decision on 2026-10-09.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run = report what would change | apply = write it'
        required: true
        default: dry-run
        type: choice
        options: [dry-run, apply]
      tester_limit:
        description: 'Public-link tester cap (Apple max 10000)'
        required: true
        default: '1000'
        type: string
      build:
        description: 'iOS build number to add (blank = newest valid)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  testflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Refuse without credentials or with a malformed input
        env:
          HAS_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY != '' }}
          LIMIT: ${{ inputs.tester_limit }}
          BUILD: ${{ inputs.build }}
        run: |
          if [ "$HAS_KEY" != "true" ]; then
            echo "::error::missing APPSTORE_API_PRIVATE_KEY (org secret)"
            exit 1
          fi
          case "$LIMIT" in ''|*[!0-9]*) echo "::error::tester_limit must be a number"; exit 1;; esac
          case "$BUILD" in *[!0-9]*) echo "::error::build must be a build number"; exit 1;; esac

      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }

      - name: Install dependencies
        run: pip install --quiet cryptography

      - name: Set up the public beta
        env:
          P8: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPLE_REVIEW_CONTACT: ${{ secrets.APPLE_REVIEW_CONTACT }}
          LIMIT: ${{ inputs.tester_limit }}
          BUILD: ${{ inputs.build }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$P8" > key.p8
          set -- --limit "$LIMIT"
          if [ -n "$BUILD" ]; then set -- "$@" --build "$BUILD"; fi
          if [ "${{ inputs.mode }}" = "apply" ]; then set -- "$@" --apply; fi
          python tool/asc_testflight.py key.p8 "$KEY_ID" "$ISSUER" 6790176897 "$@"

      - name: Shred the key
        if: always()
        run: rm -f key.p8
