name: Mac App Store (build + upload)

# Builds the Mac App Store package and uploads it to App Store Connect.
#
# Deliberately DISPATCH-ONLY: it puts a build in App Store Connect and does
# nothing else. Attaching that build to a version is asc-version.yml, submitting
# is asc-submit-review.yml (which refuses unless you name the exact version), and the gate
# that stays human is pressing release - releaseType is MANUAL, so approval and
# publication remain separate events no matter what CI does.
#
# That last gate is not caution for its own sake. On the Microsoft Store a
# machine was allowed to commit a submission and published the app at $0 -
# unstoppable once it started. See AGENT.md rules 10-13.
#
# Prerequisites (one-time, see dev/plans/apple-appstore-plan.md Gate B):
#   APPSTORE_ISSUER_ID       org SECRET  (a variable is not masked, and this one
#                                        appeared verbatim in a public CI log)
#   APPSTORE_API_KEY_ID      org variable
#   APPSTORE_API_PRIVATE_KEY org secret  (.p8 contents)
#   APPLE_TEAM_ID            org secret  (already present for the Developer ID lane)
# Signing uses the STORED App Store certificates (APPLE_MAS_* secrets). Nothing
# is minted on demand: the lane archives unsigned and signs with those, which
# is what stopped it creating a throwaway certificate on every run.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run = build only | validate = ask Apple if it would accept it | upload = send it'
        required: true
        default: dry-run
        type: choice
        options: [dry-run, validate, upload]
      build_number:
        description: 'Override CFBundleVersion (blank = pubspec). Needed to re-upload.'
        required: false
        type: string

permissions:
  contents: read

defaults:
  run:
    working-directory: app

jobs:
  build-upload:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: 3.47.0, cache: true }
      - uses: actions/setup-go@v6
        with: { go-version: 'stable', cache: false }

      - name: Refuse without credentials
        # Fail here rather than 40 minutes later at the upload step.
        env:
          HAS_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY != '' }}
          ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
          KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          missing=""
          [ "$HAS_KEY" = "true" ] || missing="$missing APPSTORE_API_PRIVATE_KEY(secret)"
          [ -n "$ISSUER" ] || missing="$missing APPSTORE_ISSUER_ID(secret)"
          [ -n "$KEY_ID" ] || missing="$missing APPSTORE_API_KEY_ID(var)"
          [ -n "$TEAM_ID" ] || missing="$missing APPLE_TEAM_ID(secret)"
          if [ -n "$missing" ]; then
            echo "::error::missing:$missing - see dev/plans/apple-appstore-plan.md Gate B"
            exit 1
          fi
          echo "credentials present"

      - name: Write the App Store Connect API key
        # xcodebuild wants the key as a FILE. It goes to a private dir and is
        # removed in an always() step below.
        env:
          P8: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          chmod 700 "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$P8" > "$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8"
          # Length only - never the contents.
          echo "key written, $(wc -c < "$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8") bytes"

      - name: Create a keychain for the provisioned certificate
        # Without this, -allowProvisioningUpdates has nowhere to store a
        # certificate: the runner's login keychain is locked, so provisioning
        # "succeeds" having created nothing and the archive falls back to
        # ad-hoc. The symptom is `0 valid identities found` with no error at all.
        # Ephemeral and job-scoped; deleted in the always() cleanup.
        run: |
          set -euo pipefail
          KC="$RUNNER_TEMP/airclone-signing.keychain-db"
          security create-keychain -p "" "$KC"
          security set-keychain-settings -lut 7200 "$KC"
          security unlock-keychain -p "" "$KC"
          # Keep the login keychain in the search list so system roots still
          # resolve; put ours first and make it the default.
          security list-keychains -d user -s "$KC" login.keychain-db
          security default-keychain -s "$KC"
          security list-keychains

      - name: Import the distribution certificates
        # Xcode's CLOUD signing cannot mint a DISTRIBUTION certificate with an
        # App Manager key - that is what "Cloud signing permission error" meant.
        # The Certificates API can, though, so both certs were created through it
        # once and stored here. Keeping the key at App Manager is deliberate:
        # Admin would let a CI credential manage users, roles and agreements.
        env:
          APP_P12: ${{ secrets.APPLE_MAS_APP_P12_BASE64 }}
          INSTALLER_P12: ${{ secrets.APPLE_MAS_INSTALLER_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_MAS_P12_PASSWORD }}
          PROFILE: ${{ secrets.APPLE_MAS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KC="$RUNNER_TEMP/airclone-signing.keychain-db"
          printf '%s' "$APP_P12"       | base64 -d > "$RUNNER_TEMP/app.p12"
          printf '%s' "$INSTALLER_P12" | base64 -d > "$RUNNER_TEMP/installer.p12"
          for f in app installer; do
            security import "$RUNNER_TEMP/$f.p12" -k "$KC" -P "$P12_PASSWORD" \
              -T /usr/bin/codesign -T /usr/bin/productbuild -A
          done
          rm -f "$RUNNER_TEMP"/*.p12
          # Without this, codesign blocks on a GUI keychain prompt that no one can
          # answer and the job hangs until it times out.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "" "$KC" > /dev/null
          # A Mac App Store build needs an embedded provisioning profile: it is
          # what carries com.apple.application-identifier and the team identifier
          # into the signature. Xcode looks for it by name in this directory.
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          printf '%s' "$PROFILE" | base64 -d > "$PROFILE_DIR/Airclone_MAS.provisionprofile"
          echo "--- identities available for signing ---"
          security find-identity -v -p codesigning "$KC"

      - name: Build librclone (the only legal engine in a sandboxed build)
        working-directory: .
        run: bash dev/desktop/build-librclone.sh

      - run: flutter config --enable-macos-desktop
      - run: flutter pub get

      - name: Build the Mac App Store flavour
        # Generates the Flutter assets and the ephemeral xcconfig that the
        # xcodebuild archive below consumes. AIRCLONE_MAS must travel with the
        # sandbox entitlement - a build without it tries to spawn rclone and is
        # killed by the sandbox.
        # BN through `env:`, not direct interpolation: format() does no shell
        # quoting, so a
        # dispatch value like `123; curl ... | sh` used to execute on the runner.
        env:
          BN: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          case "$BN" in ''|*[!0-9]*) [ -z "$BN" ] || { echo "::error::build_number must be a number"; exit 1; };; esac
          # `if`, not `[ ... ] && ...`: under errexit a false test is a failed
          # command and would kill the step whenever build_number is blank,
          # which is the default. This trap has cost this repo several runs.
          set --
          if [ -n "$BN" ]; then set -- --build-number="$BN"; fi
          flutter build macos --release --dart-define=AIRCLONE_MAS=true "$@"

      - name: Archive (unsigned)
        # Unsigned on purpose - see the block below. The App Store identities are
        # the stored APPLE_MAS_* certificates, imported into a job keychain above
        # and applied by the re-sign and export steps.
        env:
          ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
          KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          # Swap the Runner target's Release entitlements for the MAS ones, in CI
          # only, never committed. This replaces an earlier attempt to pass
          # CODE_SIGN_ENTITLEMENTS on the command line, which failed because a
          # command-line build setting applies to EVERY target in the workspace:
          # a dozen SPM plugin packages each tried to open the path relative to
          # their own directory and the archive died. Release.entitlements is
          # referenced only by Runner, so overwriting it is precisely scoped.
          cp macos/Runner/MacAppStore.entitlements macos/Runner/Release.entitlements
          echo "--- entitlements the Runner target will build with ---"
          cat macos/Runner/Release.entitlements | grep -E '<key>|<true|<false' || true
          # Same scoping trick, same reason, for the camera purpose string.
          # Info.plist is SHARED by both macOS builds, but the camera is a
          # direct-download-only feature: the QR scanner is gated off in a MAS
          # build (kMacAppStoreBuild -> qrCameraScanAvailableFor) and the
          # entitlement above is deliberately absent. Shipping the purpose string
          # anyway would declare a capability this binary does not have and
          # cannot use - exactly the needless review surface
          # MacAppStore.entitlements warns about. CI only, never committed.
          /usr/libexec/PlistBuddy -c "Delete :NSCameraUsageDescription" \
            macos/Runner/Info.plist 2>/dev/null \
            || echo "no NSCameraUsageDescription to remove"
          # CODE_SIGN_IDENTITY must be "Apple Development" - not omitted, and not
          # "Apple Distribution". Omitting it leaves project.pbxproj's "-" in
          # charge and the archive is signed ad-hoc; naming Distribution conflicts
          # with automatic signing. Xcode's own error spelled this out:
          #   "Set the code signing identity value to 'Apple Development' ...
          #    or switch to manual signing"
          # The DISTRIBUTION identity is applied later by -exportArchive with
          # method app-store-connect. Archive as development, export as release,
          # which is the normal Xcode flow.
          #
          # Unlike CODE_SIGN_ENTITLEMENTS, applying this to every target is fine:
          # it is an identity name, not a path resolved per project directory.
          # ARCHIVE UNSIGNED. This used to archive with CODE_SIGN_STYLE=Automatic
          # and "CODE_SIGN_IDENTITY=Apple Development", which made
          # -allowProvisioningUpdates MINT a development certificate on every
          # single run and never revoke it. Ten accumulated between 2026-08-20
          # and 2026-09-06, roughly one per release, until the account hit
          # Apple's cap and this lane failed with "Your account has reached the
          # maximum number of certificates" - a failure with no relation to
          # anything that had changed.
          #
          # None of them was ever needed. The NEXT step re-signs the whole app -
          # every plugin bundle, every framework, and the app itself - with the
          # stored "3rd Party Mac Developer Application" identity and the MAS
          # entitlements, so the archive signature is overwritten before export
          # and never reaches the shipped artifact. The certificate existed only
          # to satisfy `xcodebuild archive`, and an unsigned archive satisfies it
          # without minting anything. Same flow the iOS lane uses.
          xcodebuild -workspace macos/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/Airclone.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive
          echo "--- what the archive was actually signed with ---"
          codesign -dv --verbose=2 \
            "$RUNNER_TEMP/Airclone.xcarchive/Products/Applications/Airclone.app" 2>&1 \
            | grep -E 'Authority|Identifier' || true

      - name: Put librclone inside the archived app, then re-sign
        # The engine is bundled AFTER archiving because it is not an Xcode build
        # input, and re-signed BEFORE export so the export's signature seals it.
        # A dylib that the outer signature does not cover is rejected on upload.
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/Airclone.xcarchive/Products/Applications/Airclone.app"
          test -d "$APP"
          test -f macos/librclone/librclone.dylib
          mkdir -p "$APP/Contents/Frameworks"
          cp macos/librclone/librclone.dylib "$APP/Contents/Frameworks/librclone.dylib"
          lipo -info "$APP/Contents/Frameworks/librclone.dylib"
          # Prefer "3rd Party Mac Developer Application" - the identity a Mac
          # App Store build is actually signed with, and the one inside the
          # provisioning profile. This grep previously matched only
          # "Apple Distribution|Development", so it silently fell back to the
          # DEVELOPMENT identity and build 118 was rejected during processing:
          #
          #   ITMS-90284: Invalid Code Signing - The executable
          #   'Airclone.app/Contents/Resources/<plugin>.bundle' must be signed
          #   with the certificate that is contained in the provisioning profile.
          IDENTITY=$(security find-identity -v -p codesigning \
            | grep -oE '"3rd Party Mac Developer Application[^"]*"' \
            | head -1 | tr -d '"' || true)
          if [ -z "$IDENTITY" ]; then
            echo "::error::no 3rd Party Mac Developer Application identity."
            security find-identity -v -p codesigning || true
            exit 1
          fi
          echo "re-signing with: $IDENTITY"

          # INSIDE-OUT, and it MUST include Contents/Resources/*.bundle. Every
          # Flutter plugin ships one; -exportArchive re-signs the app and its
          # Frameworks but not those, and Apple's own validator does not look
          # inside them either - which is how VERIFY SUCCEEDED passed and the
          # build was still rejected hours later, by email, nine times over.
          for B in "$APP/Contents/Resources"/*.bundle; do
            [ -e "$B" ] || continue
            echo "  signing $(basename "$B")"
            codesign --force --timestamp --options runtime -s "$IDENTITY" "$B"
          done
          for F in "$APP/Contents/Frameworks"/*; do
            [ -e "$F" ] || continue
            echo "  signing $(basename "$F")"
            codesign --force --timestamp --options runtime -s "$IDENTITY" "$F"
          done
          codesign --force --timestamp --options runtime \
            --entitlements macos/Runner/MacAppStore.entitlements \
            -s "$IDENTITY" "$APP"
          codesign --verify --strict --verbose=2 "$APP"

          # Assert the authority on every nested bundle. A silent mismatch
          # here costs a whole upload and an email hours later.
          echo "--- authority on every nested bundle ---"
          BAD=0
          for B in "$APP/Contents/Resources"/*.bundle; do
            [ -e "$B" ] || continue
            AUTH=$(codesign -dv --verbose=2 "$B" 2>&1 \
              | grep '^Authority=' | head -1 | cut -d= -f2-)
            echo "  $(basename "$B"): $AUTH"
            case "$AUTH" in
              "3rd Party Mac Developer Application"*) ;;
              *) BAD=1 ;;
            esac
          done
          if [ "$BAD" = "1" ]; then
            echo "::error::a nested bundle is not signed with the store identity"
            exit 1
          fi

      - name: Export the App Store package
        env:
          ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
          KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          # MANUAL signing here, not automatic. Automatic sends Xcode to cloud
          # signing, which cannot mint a distribution certificate with an App
          # Manager key - the "Cloud signing permission error" that blocked this
          # lane. Everything it needs is now in the local keychain, named
          # explicitly, so the export is deterministic.
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingCertificate</key><string>3rd Party Mac Developer Application</string>
            <key>installerSigningCertificate</key><string>3rd Party Mac Developer Installer</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.gigaionllc.airclone</key><string>Airclone Mac App Store</string>
            </dict>
          </dict>
          </plist>
          PLIST
          echo "--- export options ---"; cat "$RUNNER_TEMP/export.plist"
          # No -allowProvisioningUpdates and no API key here either. The export
          # plist names the certificates AND the profile explicitly with
          # signingStyle manual, so there is nothing for Xcode to create - and
          # leaving the flag on left a second path that could still mint one.
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Airclone.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist"
          ls -lh "$RUNNER_TEMP/export"

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: mas-package
          path: ${{ runner.temp }}/export/*.pkg
          if-no-files-found: warn

      - name: Ask Apple whether it would accept the package
        if: ${{ inputs.mode != 'dry-run' }}
        # A real server-side check of signature, entitlements, provisioning
        # profile and bundle identity - and it changes NOTHING. It runs for both
        # validate and upload, because a rejected validation costs nothing while a
        # half-uploaded build has to be cleaned up in the console by hand.
        env:
          ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
          KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
        run: |
          set -euo pipefail
          PKG=$(ls "$RUNNER_TEMP/export"/*.pkg | head -1)
          echo "validating $PKG"
          xcrun altool --validate-app -f "$PKG" -t macos             --apiKey "$KEY_ID" --apiIssuer "$ISSUER"

      - name: Upload to App Store Connect
        if: ${{ inputs.mode == 'upload' }}
        env:
          ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
          KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
        run: |
          set -euo pipefail
          PKG=$(ls "$RUNNER_TEMP/export"/*.pkg | head -1)
          echo "uploading $PKG"
          xcrun altool --upload-app -f "$PKG" -t macos             --apiKey "$KEY_ID" --apiIssuer "$ISSUER"

      - name: What happens next
        if: ${{ inputs.mode == 'upload' }}
        run: |
          echo "Uploaded. Processing in App Store Connect takes a few minutes."
          echo "NOTHING is submitted here. Next: asc-version.yml mode=apply attaches"
          echo "the build and sets the notes, mode=audit says what Apple would still"
          echo "refuse, and asc-submit-review.yml presses 'Add for Review'. Release"
          echo "type stays MANUAL, so approval and publication remain separate events."
          echo "https://appstoreconnect.apple.com/apps/6790176897/distribution/macos/version/inflight"

      - name: Shred the API key and the keychain
        if: always()
        run: |
          rm -rf "$HOME/.appstoreconnect" || true
          security delete-keychain "$RUNNER_TEMP/airclone-signing.keychain-db" || true
