name: airclone
description: "A modern, intuitive, cross-platform GUI for rclone."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 0.7.2+120

environment:
  sdk: ^3.12.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # State management (server-state cache + client-state stores).
  flutter_riverpod: ^2.6.1
  # RC HTTP transport (desktop drives `rclone rcd` over loopback HTTP).
  http: ^1.2.0
  # Locating app-support dirs for the rclone engine + config.
  path_provider: ^2.1.4
  # Provisioning the rclone engine (download + unzip on first run).
  archive: ^4.0.0
  crypto: ^3.0.5
  # At-rest encryption for the on-disk preview cache (AES-GCM + PBKDF2).
  cryptography: ^2.7.0
  # OS credential-vault storage for the (opt-in, default-off) rclone config
  # password, so scheduled/background runs can unlock an encrypted config
  # unattended: Windows DPAPI / Credential Manager, macOS Keychain, Linux
  # Secret Service. See state/config_password_vault.dart.
  flutter_secure_storage: ^9.2.2
  # beta: opt-in biometric RELEASE of the vault-stored config password at launch
  # (plan §6). Adds no crypto — the OS keystore already binds the secret; a
  # fingerprint/face prompt just gates its release instead of the typing prompt.
  # Phone-first (Android/iOS); Windows Hello needs local_auth_windows later.
  # NOTE: Android requires MainActivity to extend FlutterFragmentActivity and iOS
  # needs NSFaceIDUsageDescription — see state/biometric_unlock.dart.
  local_auth: ^2.3.0

  # alpha.3: app version (update check), open links, settings store.
  # (OS→app file drop moved to super_drag_and_drop's DropRegion in alpha.35.)
  package_info_plus: ^8.0.0
  url_launcher: ^6.3.0
  shared_preferences: ^2.3.0
  # Native folder picker for adding custom sidebar Locations.
  file_selector: ^1.0.0

  # alpha.5: file previews (images/text use built-ins; these add markdown + PDF).
  flutter_markdown: ^0.7.4
  # 2.x is required from Flutter 3.47 on: 1.3.5's `PdfFileCache?` handling is
  # rejected outright by the newer analyzer (null-flow), so the desktop builds
  # simply stop compiling. See dev/releases/v0.6.4.md.
  pdfrx: ^2.4.7

  # alpha.6: video/audio preview (libmpv-backed, bundled libs for desktop).
  media_kit: ^1.1.10
  media_kit_video: ^1.2.4
  media_kit_libs_video: ^1.0.4
  # alpha.25: opt-in Windows 11 Mica/Acrylic window backdrop.
  flutter_acrylic: ^1.1.4
  # alpha.32: drag a local file OUT to the OS from a row drag-handle. Its native
  # side (super_native_extensions) builds a Rust crate via cargokit, so DESKTOP
  # builds need a Rust toolchain on PATH (CI installs it; see release.yml).
  super_drag_and_drop: ^0.9.1

  # Scan an Offline QR with the phone camera to import a config (the camera
  # counterpart to the desktop's image-decode). The permission is requested
  # in-flow the first time the scanner opens, NOT at launch (Android CAMERA is in
  # the manifest; iOS needs NSCameraUsageDescription in Info.plist). See
  # ui/scan_from_desktop_sheet.dart.
  mobile_scanner: ^7.0.0

  # Renders the Offline QR for "Export QR Config" (the whole encrypted config is
  # IN the QR — no key, no URL travels separately). See ui/offline_qr_dialog.dart.
  # QR IMPORT is phone-camera only (mobile_scanner); a computer can't scan, so
  # there is no desktop image-decode path — it points at Import/Export File Config.
  qr_flutter: ^4.1.0

  # Desktop pop-out image viewer: opens an image in its own independently-
  # resizable native OS window (multiple images -> multiple windows), each with
  # its own pinch/scroll zoom, decoupled from the main app window. DESKTOP ONLY
  # (the plugin declares no Android/iOS implementation); every call is
  # Platform-guarded so mobile never touches its channel. Each pop-out runs its
  # own FlutterEngine in this SAME process, dispatched in main.dart via
  # WindowController.fromCurrentEngine(). See ui/popout_image_app.dart. Pinned:
  # re-test on every Flutter stable bump (0.3.0 is the only 0.3.x).
  desktop_multi_window: ^0.3.0

  # Dual-engine (MAS/iOS + desktop option): the in-process rclone engine
  # (FfiRcloneClient) calls librclone's C ABI over dart:ffi — RcloneInitialize /
  # RcloneRPC(method,json) / RcloneFinalize — instead of spawning `rcd`. `ffi`
  # supplies the native-string helpers (toNativeUtf8/toDartString + malloc). The
  # native lib (librclone.dll/.dylib/.so) is built from the pinned rclone via
  # dev/desktop/build-librclone.ps1 and bundled beside the app. See
  # rclone/librclone_ffi.dart + rclone/ffi_rclone_client.dart and
  # dev/plans/dual-engine-plan.md.
  ffi: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Drives the real app on a real simulator for App Store screenshots. Tapping
  # the Simulator window by coordinate is possible but brittle - device bezels,
  # window zoom and title-bar height all move the target. Driving from inside
  # the app finds widgets by what they SAY, which is stable.
  integration_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  # Packages the Windows build as an .msix for the Microsoft Store (see the
  # msix_config section below + release.yml). Dev-only tool, not shipped in-app.
  msix: ^3.18.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# Microsoft Store packaging (the `msix` dev dependency). Build with
# `dart run msix:create` (locally: test-cert signed .msix; release.yml passes
# --store for a Partner-Center-uploadable, Store-signed package). The version is
# overridden per-release by CI (--version <x.y.z>.0).
#
# Store identity is validated on UPLOAD, before certification even starts, and a
# mismatch is a hard "Package acceptance validation error". None of it comes from a
# signing certificate — `--store` packages are unsigned and Microsoft signs them;
# the values must match Partner Center → Product management → Product identity.
#
# `identity_name`, `publisher` and `display_name` below are deliberately INERT
# PLACEHOLDERS. The real ones are injected by release.yml from the repo variables
# MSIX_IDENTITY_NAME / MSIX_PUBLISHER / MSIX_DISPLAY_NAME, because
# Package/Identity/Publisher is a Partner-Center-assigned GUID and this repo is
# public. A local `dart run msix:create` therefore produces a package that INSTALLS
# fine for testing but is NOT submittable — that is intended.
#
# `publisher_display_name` is the real value: it is the company name, already public
# throughout this repo (installer AppPublisher, code-signing subject), and is not a
# GUID. It was rejected as the placeholder "GigaionLLC" on the first v0.6.0 upload.
#
# Gotcha: msix drives BOTH Package/Properties/DisplayName and the Start-menu tile
# (uap:VisualElements/@DisplayName) from `display_name`, so MSIX_DISPLAY_NAME must be
# a RESERVED app name and is also what users see on the tile.
msix_config:
  display_name: Airclone
  publisher_display_name: "Gigaion, LLC"
  identity_name: PLACEHOLDER.SetMsixIdentityNameVar
  publisher: CN=PLACEHOLDER-SET-MSIX-PUBLISHER-VAR
  msix_version: 0.6.7.0
  logo_path: ../docs/brand/airclone-icon-1024.png
  capabilities: internetClient
  # `dart run msix:create --store` (used in CI) produces an unsigned,
  # Partner-Center-ready package; omit --store locally to get a test-signed one.
  store: false
