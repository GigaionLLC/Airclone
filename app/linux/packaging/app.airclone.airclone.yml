# Flatpak manifest for Airclone.
#
# Built from the ALREADY-BUILT Flutter bundle rather than from source: the
# Flutter SDK is not in the GNOME SDK, and vendoring a toolchain into a manifest
# to rebuild what CI has already produced buys nothing for a direct download.
# (Flathub wants source builds or checksummed extra-data — see
# dev/linux/build-flatpak.sh for what changes if we go there.)
#
# The bundle is staged into a build context by that script; `type: dir` below
# reads it.
app-id: app.airclone.airclone
runtime: org.gnome.Platform
runtime-version: '48'
sdk: org.gnome.Sdk
command: airclone

# Every permission here is one the app genuinely cannot work without, and the
# list is deliberately short for the same reason the Mac App Store entitlements
# are: each one has to be defensible, and a permission nobody needs is not merely
# untidy.
finish-args:
  # A window, and hardware rendering for it.
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri

  # rclone talks to cloud provider APIs. Outbound; there is no server of ours.
  - --share=network

  # Audio and video preview play through the app.
  - --socket=pulseaudio

  # THE BIG ONE, and it is the whole product: Airclone is a file manager. Its job
  # is to move files between the user's disk and the user's cloud storage, and
  # "which files" is decided by the user at run time. Portals cannot express that
  # — they hand back one file at a time, chosen through a dialog, which is not
  # what "sync this folder every night" means.
  - --filesystem=host

  # libsecret, for the config-password vault (flutter_secure_storage_linux).
  - --talk-name=org.freedesktop.secrets

# WHY THERE ARE FOUR MODULES BEFORE THE APP.
#
# The Flutter binary links libmpv (media_kit, for image/video/audio preview) and
# libsecret (the config-password vault). The AppImage gets both by copying them
# off the build machine — an AppImage may do that; a Flatpak may not, because the
# sandbox has no access to host libraries. So anything the runtime does not carry
# has to be built here.
#
# The build asks the runtime what it has rather than assuming (see
# dev/linux/build-flatpak.sh). On org.gnome.Platform 48 the answer is:
#
#   libsecret-1.so.0   PRESENT   -> nothing to do
#   libavcodec.so.61   PRESENT   -> ffmpeg is there, which is the expensive one
#   libmpv             MISSING   -> build it
#   libplacebo         MISSING   -> mpv 0.38+ requires it
#   libass             MISSING   -> mpv requires it for subtitles
#
# Re-run that probe after a runtime bump: if a later GNOME runtime starts
# shipping libmpv, three of these modules become dead weight.
modules:
  # Build-time only. libplacebo generates its OpenGL loader with glad, which is a
  # Python tool that imports Jinja2, and the GNOME SDK does not ship it. Network
  # is enabled for this one module because pip needs it; nothing it installs ends
  # up in the final app (see `cleanup` below).
  - name: python3-jinja2
    buildsystem: simple
    build-options:
      build-args:
        - --share=network
    build-commands:
      - pip3 install --prefix=/app jinja2
    cleanup:
      - '*'

  - name: libass
    buildsystem: autotools
    config-opts:
      - --disable-static
    sources:
      - type: archive
        url: https://github.com/libass/libass/releases/download/0.17.3/libass-0.17.3.tar.xz
        sha256: eae425da50f0015c21f7b3a9c7262a910f0218af469e22e2931462fed3c50959
    cleanup:
      - /include
      - /lib/pkgconfig
      - '*.la'

  - name: libplacebo
    buildsystem: meson
    config-opts:
      # meson picks lib64 on this runtime, which puts libplacebo.pc outside the
      # PKG_CONFIG_PATH flatpak-builder sets (/app/lib/pkgconfig). mpv then
      # reports "Dependency libplacebo not found" for a library that built and
      # installed perfectly well two modules earlier.
      - --libdir=lib
      - -Ddemos=false
      - -Dtests=false
      # Vulkan would pull a larger dependency set for no gain here: media_kit
      # drives libmpv through its OpenGL render API.
      - -Dvulkan=disabled
      - -Dopengl=enabled
    sources:
      # git rather than a release tarball ON PURPOSE: libplacebo keeps glad as a
      # submodule under 3rdparty/, and GitHub's generated tarballs do not contain
      # submodules — the build then fails looking for a loader it cannot generate.
      - type: git
        url: https://code.videolan.org/videolan/libplacebo.git
        tag: v7.349.0
    cleanup:
      - /include
      - /lib/pkgconfig

  - name: mpv
    buildsystem: meson
    config-opts:
      # Same reason as libplacebo: keep libmpv.so where the app will look.
      - --libdir=lib
      # The LIBRARY, not the player: media_kit loads libmpv, and nothing here
      # needs an mpv binary, a manual page, or a scripting runtime.
      - -Dlibmpv=true
      - -Dcplayer=false
      - -Dmanpage-build=disabled
      - -Dlua=disabled
      - -Djavascript=disabled
      - -Dlibarchive=disabled
    sources:
      - type: archive
        url: https://github.com/mpv-player/mpv/archive/refs/tags/v0.39.0.tar.gz
        sha256: 2ca92437affb62c2b559b4419ea4785c70d023590500e8a52e95ea3ab4554683
    cleanup:
      - /include
      - /lib/pkgconfig
      - /share/applications
      - /share/icons

  - name: airclone
    buildsystem: simple
    build-commands:
      # The WHOLE bundle stays together under /app/airclone: a Flutter Linux app
      # resolves data/ and lib/ relative to its own binary, so splitting them
      # across /app/bin and /app/lib produces a build that installs cleanly and
      # then fails to start. /app/bin/airclone is a two-line launcher instead.
      - install -d /app/airclone
      - cp -a bundle/. /app/airclone/
      - chmod +x /app/airclone/airclone
      - install -Dm755 airclone-launcher /app/bin/airclone
      - install -Dm644 app.airclone.airclone.desktop -t /app/share/applications/
      - install -Dm644 app.airclone.airclone.metainfo.xml -t /app/share/metainfo/
      - install -Dm644 icons/64.png /app/share/icons/hicolor/64x64/apps/app.airclone.airclone.png
      - install -Dm644 icons/128.png /app/share/icons/hicolor/128x128/apps/app.airclone.airclone.png
      - install -Dm644 icons/256.png /app/share/icons/hicolor/256x256/apps/app.airclone.airclone.png
      - install -Dm644 icons/512.png /app/share/icons/hicolor/512x512/apps/app.airclone.airclone.png
    sources:
      - type: dir
        path: .
